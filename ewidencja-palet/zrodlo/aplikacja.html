function courierOrder(c){ return Number.isFinite(c.order) ? c.order : 999; }
// swap in the displayed order, then renumber everyone 1..n — also repairs duplicate/missing values
async function moveCourier(id, dir){
  const sorted = [...couriers].sort((a,b)=>courierOrder(a)-courierOrder(b));
  const idx = sorted.findIndex(c=>c.id===id), swapIdx = idx+dir;
  if(idx<0 || swapIdx<0 || swapIdx>=sorted.length) return;
  [sorted[idx], sorted[swapIdx]] = [sorted[swapIdx], sorted[idx]];
  try{
    for(let k=0;k<sorted.length;k++){ if(sorted[k].order!==k+1) await db.collection('couriers').doc(sorted[k].id).update({order:k+1}); }
  }catch(e){ console.error(e); toast('Nie udało się zmienić kolejności', true); }

async function saveTransaction(form){
  if(!historyComplete){ toast('Trwa wczytywanie historii — spróbuj za chwilę', true); return false; }
  const fd = new FormData(form);
  const editId = fd.get('editId') || '';
  const orig = editId ? transactions.find(t=>t.id===editId) : null;
  if(editId && !orig){ toast('Ta operacja została w międzyczasie usunięta', true); return false; }
  const typ = fd.get('typ');
  const iloscRaw = String(fd.get('ilosc')||'').trim();
  const ilosc = /^\d+$/.test(iloscRaw) ? parseInt(iloscRaw,10) : NaN;
  const data = String(fd.get('data')||'');
  const uwagi = String(fd.get('uwagi')||'').trim().slice(0,500);
  // validate everything BEFORE creating a new courier, so a typo never leaves an orphan courier behind
  if(typ!=='wydanie' && typ!=='zwrot'){ toast('Wybierz typ operacji', true); return false; }
  if(!Number.isInteger(ilosc) || ilosc<1){ toast('Podaj ilość palet — liczbę całkowitą większą od zera', true); return false; }
  if(ilosc>100000){ toast('Ta ilość palet jest nierealnie duża — sprawdź wpis', true); return false; }
  if(!/^\d{4}-\d{2}-\d{2}$/.test(data)){ toast('Podaj datę operacji', true); return false; }
  if(data > todayStr()){ toast('Data operacji nie może być z przyszłości', true); return false; }
  if(data < '2000-01-01'){ toast('Sprawdź rok w dacie operacji', true); return false; }

  let kurierId = fd.get('kurierId'); let kurierNazwa; let newCourier = null;
  if(kurierId === '__new__'){
    const newName = String(fd.get('newCourierName')||'').trim().replace(/\s+/g,' ').slice(0,60);
    if(!newName){ toast('Podaj nazwę nowego kuriera', true); return false; }
    const same = couriers.find(c=>(c.name||'').trim().toLowerCase()===newName.toLowerCase());
    const orphan = same ? null : findOrphanByName(newName);
    const back = orphan ? await askRestore(newName, orphan) : false;
    if(back===null) return false;
    if(same){ kurierId = same.id; kurierNazwa = same.name; toast(`Kurier „${same.name}” już istnieje — operacja zostanie zapisana u niego`); }
    else if(back){
      // the deleted courier comes back (with its history) and the operation is saved under it
      const order = (couriers.length? Math.max(...couriers.map(c=>c.order||0)) : 0) + 1;
      newCourier = {id:orphan.id, data:{name:newName, order, color:COURIER_COLORS[couriers.length % COURIER_COLORS.length], custom:true, enabled:true}};
      kurierId = orphan.id; kurierNazwa = newName;
    }
    else {
      let base = slugify(newName), id = base, i=2;
      while(courierById(id) || transactions.some(t=>t.kurierId===id)) { id = `${base}-${i}`; i++; }
      const order = (couriers.length? Math.max(...couriers.map(c=>c.order||0)) : 0) + 1;
      newCourier = {id, data:{name:newName, order, color:COURIER_COLORS[couriers.length % COURIER_COLORS.length], custom:true, enabled:true}};
      kurierId = id; kurierNazwa = newName;
    }
  } else {
    const c = courierById(kurierId);
    const known = transactions.find(t=>t.kurierId===kurierId);
    if(c) kurierNazwa = c.name;
    else if(orig && orig.kurierId===kurierId) kurierNazwa = orig.kurierNazwa;
    else if(known) kurierNazwa = known.kurierNazwa || kurierId;
    else { toast('Wybierz kuriera', true); return false; }
  }

  // typo guards
  if(ilosc>=100 && (!orig || orig.ilosc!==ilosc)){
    const ok = await confirmDialog('Duża ilość palet', `Czy na pewno <b>${palet(ilosc)}</b> w jednej operacji? Sprawdź, czy nie ma literówki.`, {okLabel:'Tak, zapisz', danger:false});
    if(!ok) return false;
  }
  let twinOk = false;
  if(!orig){
    const twin = transactions.filter(t=> t.kurierId===kurierId && t.typ===typ && t.ilosc===ilosc && t.data===data && t.createdAt && Date.now()-t.createdAt < 15*60000)
      .sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))[0];
    if(twin){
      const nr = buildDocketMap()[twin.id]||'';
      const mins = Math.max(1, Math.round((Date.now()-twin.createdAt)/60000));
      const ok = await confirmDialog('Taka operacja już jest', `Identyczną operację (${escapeHtml(kurierNazwa)}, ${typ==='wydanie'?'wydanie':'zwrot'}, ${palet(ilosc)}, ${fmtDate(data)}) zapisano ${mins} min temu jako <b>${escapeHtml(nr)}</b>. Zapisać ją jeszcze raz?`, {okLabel:'Zapisz ponownie', danger:false});
      if(!ok) return false;
      twinOk = true;   // a deliberate repeat — not reported later as a possible double entry
    }
  }

  if(newCourier){
    try{ await db.collection('couriers').doc(newCourier.id).set(newCourier.data); }
    catch(e){ console.error(e); toast('Nie udało się dodać nowego kuriera', true); return false; }
    if(!courierById(newCourier.id)) couriers = [...couriers, {id:newCourier.id, ...newCourier.data}];
  }
  const payload = {kurierId, kurierNazwa, typ, ilosc, data, uwagi};
  if(twinOk) payload.twinOk = true;
  // an operation dated on/before the oldest day of the live window is not delivered by the live
  // subscription — keep our own copy in olderTx so it counts immediately
  const keepOlder = (id, doc)=>{
    if(olderBoundary && doc.data <= olderBoundary) olderTx.set(id, {...doc, id});
    else if(olderTx.has(id)){ olderTx.delete(id); applyLocalTx(id, doc); }   // moved into the live window: the live subscription owns it now
    else return;
    mergeTransactions(); render(true);
  };
  let allocated = null;
  try{
    if(orig){
      if(orig.twinOk && (orig.kurierId!==payload.kurierId || orig.typ!==payload.typ || orig.ilosc!==payload.ilosc || orig.data!==payload.data)) payload.twinOk = false;
      if(orig.typ!==payload.typ){ allocated = payload.nr = await allocDocket(payload.typ); payload.nrAt = Date.now(); } // WZ ↔ PZ: new number of the right kind
      await db.collection('transactions').doc(editId).update(payload);
      applyLocalTx(editId, {...orig, ...payload});
      keepOlder(editId, {...orig, ...payload});
      noteLocalWrite();
      if(allocated) await ensureUniqueDocket(editId, allocated, payload.typ);
      toast('Operacja zaktualizowana'+(payload.nr? ` — nowy numer ${payload.nr}`:''));
    }
    else {
      payload.createdAt = Date.now();
      allocated = payload.nr = await allocDocket(payload.typ);
      payload.nrAt = Date.now();
      const ref = await db.collection('transactions').add(payload);
      if(!(olderBoundary && payload.data <= olderBoundary)) applyLocalTx(ref.id, payload);
      keepOlder(ref.id, payload);
      noteLocalWrite();
      const finalNr = await ensureUniqueDocket(ref.id, payload.nr, payload.typ);
      toast((payload.typ==='wydanie'? 'Zarejestrowano wydanie palet':'Zarejestrowano zwrot palet')+` (${finalNr})`);
    }
    return {ok:true, kurierId, typ, data};
  }catch(e){
    console.error(e);
    if(allocated && !(e && e.code==='unique')) releaseDocket(allocated);
    toast(e && e.code==='busy' ? e.message : e && e.auth ? 'Nie zapisano operacji. '+e.message : 'Nie udało się zapisać operacji'+(e && e.code==='unavailable' ? ' — brak połączenia z bazą' : ''), true);
    return false;
  }
}
async function deleteTransaction(id){
  const t = transactions.find(x=>x.id===id);
  const wasOlder = olderTx.has(id);
  const backup = t ? {...t} : null; if(backup) delete backup.id;
  try{
    await db.collection('transactions').doc(id).delete();
    const li = liveTx.findIndex(x=>x.id===id); if(li>-1) liveTx.splice(li,1);
    olderTx.delete(id); mergeTransactions(); render(true); noteLocalWrite();
    toast(`Operacja ${backup && backup.nr ? backup.nr+' ' : ''}usunięta`, false, backup ? {label:'Cofnij', onClick: async ()=>{
      try{
        await db.collection('transactions').doc(id).set(backup);
        if(wasOlder) olderTx.set(id, {id, ...backup}); else applyLocalTx(id, backup);
        mergeTransactions(); render(true); noteLocalWrite();

      }catch(e){ console.error(e); toast('Nie udało się przywrócić operacji', true); }

  }

}

/* ---------------------------- EVENT BINDING ---------------------------- */
// A date typed from the keyboard passes through values like 0002-09-15 while the year is entered;
// applying (and re-rendering) on each of them would move the caret and garble the date. Apply only a
// complete, plausible date (or an emptied field) — immediately, or when the field loses focus.
// apply(v) only stores the new value; the view is re-rendered here.
let pointerHeld = false;   // a mouse/touch press is in progress (seen in the capture phase, before the field's blur)
document.addEventListener('pointerdown', ()=>{ pointerHeld = true; }, true);
['pointerup','pointercancel'].forEach(ev=> document.addEventListener(ev, ()=>{ pointerHeld = false; }, true));
// some presses never deliver pointerup (a native select popup, a context menu): typing ends them
document.addEventListener('keydown', ()=>{ pointerHeld = false; }, true);
// run fn once the press in progress has ended and its click was handled — re-rendering between
// mousedown and mouseup would replace the button being clicked, and the click would be lost
function afterPointer(fn){
  if(!pointerHeld){ setTimeout(fn, 0); return; }
  let done = false;
  const go = ()=>{ if(done) return; done = true; document.removeEventListener('pointerup', go, true); document.removeEventListener('pointercancel', go, true); setTimeout(fn, 0); };
  document.addEventListener('pointerup', go, true); document.addEventListener('pointercancel', go, true);
  setTimeout(go, 4000);
}
function bindDateInput(input, apply){
  if(!input) return;
  let last = input.value, typed = false;
  const ok = (v)=> v==='' || (/^\d{4}-\d{2}-\d{2}$/.test(v) && v>='2000-01-01' && v<='2099-12-31');
  // store a complete new value; true when something changed
  const commit = ()=>{
    if(!input.isConnected) return false;
    if(input.validity && input.validity.badInput) return false;   // a segment is half-typed: not a real value yet
    const v = input.value; typed = false;
    if(v===last || !ok(v)) return false;
    last = v; apply(v);
    return true;
  };
  const rerender = ()=>{
    if(!input.isConnected){ pendingDataRender = false; return; }   // the view was rebuilt meanwhile (e.g. by the clicked button)
    pendingDataRender = false; render();
  };
  // typing applies on Enter / leaving the field; the calendar picker or the clear button apply at once
  input.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); if(commit() || pendingDataRender) setTimeout(rerender, 0); } else if(e.key!=='Tab' && e.key!=='Shift') typed = true; });
  input.addEventListener('change', ()=>{ if(!typed && commit()) setTimeout(rerender, 0); });   // never re-render from inside an input event
  input.addEventListener('blur', ()=>{
    // switching windows or tabs blurs the field while it stays focused (maybe half-typed): not leaving it
    if(document.activeElement===input) return;
    const changed = commit();
    if(!changed && !pendingDataRender) return;
    afterPointer(()=>{
      const ae = document.activeElement;
      // only a data refresh is waiting and focus went on to another date field: that field's blur does it
      // (also the same field: switching windows blurs it while it stays focused, maybe half-typed)
      if(!changed && ae && ae.matches && ae.matches('input[type=date]') && input.isConnected){ pendingDataRender = true; return; }
      rerender();
    });
  });
}
// The calendar day can change while the page stays open (a shared warehouse PC left on overnight):
// the "not after today" limits move on, and an untouched default date in the operation form follows.
let shownDay = todayStr();
function checkDayChange(){
  const now = todayStr(); if(now===shownDay) return;
  const prev = shownDay; shownDay = now;
  const ae = document.activeElement;
  document.querySelectorAll('input[type=date]').forEach(el=>{
    if(!el.max || el.max >= now) return;
    // changing the limit of the field being typed into would commit a half-typed segment: on blur / Enter
    if(el===ae){ el.dataset.maxLater = now; return; }
    el.max = now;
  });
  const d = document.getElementById('opData');
  if(d && !editingId && !d.dataset.touched && d.value && d.value===prev){
    const q = document.getElementById('opIlosc'), u = document.getElementById('opUwagi');
    if(d!==ae && (!q || !q.value) && (!u || !u.value.trim())){
      d.value = now; toast(`Zmienił się dzień — data operacji ustawiona na dziś (${fmtDate(now)}).`);
    } else {
      // a form filled in yesterday keeps its date; saving it is stopped once, so the date gets checked
      d.dataset.dayWarn = prev;
      afterPointer(()=>{ const h = document.getElementById('opDateHint'); if(h && d.isConnected && !d.dataset.touched){ h.textContent = `Formularz otwarto ${fmtDate(prev)}, a jest już ${fmtDate(now)} — sprawdź datę operacji.`; h.hidden = false; } });
    }
  }
  if(db) afterPointer(()=>render(true));   // "today" figures and limits; never between mousedown and mouseup
}
const applyMaxLater = (el)=>{ if(el && el.dataset && el.dataset.maxLater){ el.max = el.dataset.maxLater; delete el.dataset.maxLater; } };
setInterval(checkDayChange, 30000);

    if(!t) return;
    const nr = buildDocketMap()[t.id] || '';
    confirmModal('Usunąć operację?', `${nr? `<b>${escapeHtml(nr)}</b> · ` : ''}${fmtDate(t.data)} — ${escapeHtml(txCourierName(t))}, ${t.typ==='wydanie'?'wydanie':'zwrot'} ${palet(t.ilosc)}. Numery pozostałych dokumentów się nie zmienią, a usunięcie można cofnąć przez kilka sekund.`, ()=>deleteTransaction(b.dataset.id));
  }));

  main.querySelectorAll('[data-period]').forEach(b=>b.addEventListener('click', ()=>{ statsPeriod=b.dataset.period; render(); }));

  // dashboard quick actions, printing
  main.querySelectorAll('[data-action="quick-op"]').forEach(b=>b.addEventListener('click', (e)=>{ e.stopPropagation(); openNewOpFor(b.dataset.id, b.dataset.typ); }));
  // non-button elements that behave like buttons respond to Enter / Space
  main.querySelectorAll('[role="button"][tabindex]').forEach(el=>el.addEventListener('keydown', (e)=>{ if((e.key==='Enter' || e.key===' ') && e.target===el){ e.preventDefault(); el.click(); } }));
  main.querySelectorAll('[data-action="print-op"]').forEach(b=>b.addEventListener('click', (e)=>{ e.stopPropagation(); printOperation(b.dataset.id); }));

  // courier settlement statement
  main.querySelectorAll('[data-st-preset]').forEach(b=>b.addEventListener('click', ()=>{
    const pr = datePresets().find(x=>x.key===b.dataset.stPreset); if(!pr) return;
    stFrom = pr.from; stTo = pr.to; render();
  }));
  const stF = document.getElementById('stFrom'), stT = document.getElementById('stTo');
  if(stF && stT){
    // each field sets only its own date; an inverted range is shown as an error until corrected
    bindDateInput(stF, (v)=>{ stFrom = v; }); bindDateInput(stT, (v)=>{ stTo = v; });
  }
  const stPrint = main.querySelector('[data-action="st-print"]');
  if(stPrint) stPrint.addEventListener('click', ()=>{
    if(stFrom && stTo && stFrom > stTo){ toast('Popraw okres — data „od” jest późniejsza niż „do”', true); return; }
    const c = courierById(selectedCourierId) || {name:(transactions.find(t=>t.kurierId===selectedCourierId)||{}).kurierNazwa || selectedCourierId};
    openPrint(`Rozliczenie — ${c.name}`, statementPrintHtml(c, courierStatement(selectedCourierId, stFrom, stTo), stFrom, stTo), `rozliczenie-${slugify(c.name)}-${stFrom||'start'}-${stTo||todayStr()}.html`);
  });
  const stCsv = main.querySelector('[data-action="st-csv"]');
  if(stCsv) stCsv.addEventListener('click', ()=>exportStatementCsv(selectedCourierId));

  // settings
  const bExp = main.querySelector('[data-action="backup-export"]');
  if(bExp) bExp.addEventListener('click', async ()=>{ bExp.disabled = true; try{ await exportBackup(); } finally { bExp.disabled = false; } });
  const bImp = main.querySelector('[data-action="backup-import"]'), bFile = document.getElementById('backupFile');
  if(bImp && bFile){ bImp.addEventListener('click', ()=>bFile.click()); bFile.addEventListener('change', ()=>{ const f = bFile.files[0]; bFile.value = ''; importBackupFile(f); }); }
  main.querySelectorAll('[data-issue-act]').forEach(b=>b.addEventListener('click', ()=>handleIssueAction(b)));

  // courier detail: week nav
  main.querySelectorAll('[data-action="week-prev"]').forEach(b=>b.addEventListener('click', ()=>{ cdWeekOffset--; render(); }));
  main.querySelectorAll('[data-action="week-next"]').forEach(b=>b.addEventListener('click', ()=>{ cdWeekOffset++; render(); }));
  main.querySelectorAll('[data-action="year-prev"]').forEach(b=>b.addEventListener('click', ()=>{ cdYear--; cdExpandedMonth=null; cdExpandedWeek=null; render(); }));
  main.querySelectorAll('[data-action="year-next"]').forEach(b=>b.addEventListener('click', ()=>{ cdYear++; cdExpandedMonth=null; cdExpandedWeek=null; render(); }));
  main.querySelectorAll('[data-action="toggle-month"]').forEach(b=>b.addEventListener('click', ()=>{
    cdExpandedMonth = cdExpandedMonth===b.dataset.mk ? null : b.dataset.mk; cdExpandedWeek=null; render();
  }));
  main.querySelectorAll('[data-action="toggle-week"]').forEach(b=>b.addEventListener('click', ()=>{
    cdExpandedWeek = cdExpandedWeek===b.dataset.wk ? null : b.dataset.wk; render();
  }));

  // couriers
  const addCourierBtn = main.querySelector('[data-action="add-courier"]');
  if(addCourierBtn) addCourierBtn.addEventListener('click', openAddCourierModal);
  main.querySelectorAll('[data-action="edit-courier"]').forEach(row=>row.addEventListener('click', ()=>openEditCourierModal(row.dataset.id)));
  main.querySelectorAll('[data-action="toggle-courier"]').forEach(inp=>{
    inp.addEventListener('click', (e)=>e.stopPropagation());
    inp.closest('.switch').addEventListener('click', (e)=>e.stopPropagation());
    inp.addEventListener('change', (e)=>{ toggleCourier(inp.dataset.id, e.target.checked); });
  });
  main.querySelectorAll('[data-action="move-courier"]').forEach(b=>b.addEventListener('click', (e)=>{
    e.stopPropagation(); if(b.disabled) return; moveCourier(b.dataset.id, parseInt(b.dataset.dir,10));
  }));
}

/* ---------------------------- BOOT ---------------------------- */
let resizeT;
const redrawCharts = ()=>{
  clearTimeout(resizeT);
  resizeT = setTimeout(()=>{ if(currentView==='stats' || currentView==='courierDetail') render(true); }, 180);
};
window.addEventListener('resize', redrawCharts);
// the content area can change width without a window resize (a hidden page shown again, a scrollbar):
// charts are drawn for the real width, so they are drawn again
if(typeof ResizeObserver==='function'){
  let lastMainW = -1;   // -1: not measured yet, 0: hidden
  new ResizeObserver((entries)=>{ const w = Math.round(entries[0].contentRect.width); if(w > 0 && lastMainW >= 0 && (lastMainW===0 || Math.abs(w - lastMainW) > 2)) redrawCharts(); lastMainW = w; }).observe(document.getElementById('main'));
}
render();
initDb();
</script>
</body>
</html>
