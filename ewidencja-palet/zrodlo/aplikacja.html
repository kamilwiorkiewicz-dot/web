   ================================================================ */
function chartWidth(){
  // match the SVG's viewBox to the real rendered width so font-size (in SVG
  // user units) doesn't shrink into illegibility on narrow phone screens.
  const vw = window.innerWidth;
  if(vw < 860) return Math.max(280, Math.min(620, vw - 60));
  return 720;
}
function isNarrow(){ return window.innerWidth < 560; }

function niceStep(span){
  const raw = Math.max(1, span/4); const p = Math.pow(10, Math.floor(Math.log10(raw))); const f = raw/p;
  return Math.max(1, (f<=1?1:f<=2?2:f<=5?5:10)*p);
}
function axisPad(values){ return Math.max(30, Math.round(Math.max(...values.map(v=>num(v).length))*7.8 + 12)); }
function svgBarChartGrouped(labels, seriesA, seriesB, colorA, colorB, opts={}){
  const rawMax = Math.max(1, ...seriesA, ...seriesB); const tick = niceStep(rawMax); const max = tick*Math.ceil(rawMax/tick);
  const w = opts.width||chartWidth(), h = opts.height||230, padL=axisPad([0, max]), padB=28, padT=10, padR=8;
  const innerW = w-padL-padR, innerH = h-padT-padB;
  const nameA = opts.nameA||'Wydania', nameB = opts.nameB||'Zwroty';
  const n = labels.length; const groupW = innerW/n; const barW = Math.min(16, groupW*0.34);
  const maxLabels = Math.max(3, Math.floor(w/56));
  let bars = '', gridLines = '', xLabels = '';
  const steps = Math.round(max/tick);
  for(let i=0;i<=steps;i++){
    const y = padT + innerH - (innerH*i/steps); const v = tick*i;
    gridLines += `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="var(--border)" stroke-width="1"/>`;
    gridLines += `<text x="${padL-6}" y="${y+4}" font-size="12.5" font-weight="600" text-anchor="end" fill="var(--text-dim)" font-family="IBM Plex Mono, monospace">${num(v)}</text>`;
  }
  labels.forEach((lab,i)=>{
    const cx = padL + groupW*i + groupW/2; const ah=(seriesA[i]/max)*innerH; const bh=(seriesB[i]/max)*innerH;
    bars += `<rect x="${cx-barW-2}" y="${padT+innerH-ah}" width="${barW}" height="${ah}" rx="2" fill="${colorA}"><title>${lab} · ${nameA}: ${num(seriesA[i])}</title></rect>`;
    bars += `<rect x="${cx+2}" y="${padT+innerH-bh}" width="${barW}" height="${bh}" rx="2" fill="${colorB}"><title>${lab} · ${nameB}: ${num(seriesB[i])}</title></rect>`;
    if(n<=maxLabels || i%Math.ceil(n/maxLabels)===0) xLabels += xAxisLabel(cx, h-7, lab, w);
  });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;" role="img" ${chartAttr(wd=>svgBarChartGrouped(labels, seriesA, seriesB, colorA, colorB, {...opts, width:wd}))}>${gridLines}${bars}${xLabels}</svg>`;
}
function svgLineChart(labels, series, color, opts={}){
  const rawMax = Math.max(...series, 0), rawMin = Math.min(...series, 0);
  const tick = niceStep((rawMax-rawMin)||1);
  const maxV = rawMax>0 ? tick*Math.ceil(rawMax/tick) : (rawMin<0 ? 0 : tick), minV = tick*Math.floor(rawMin/tick), range=(maxV-minV)||1, n=series.length;
  const w = opts.width||chartWidth(), h = opts.height||200, padL=axisPad([maxV, minV]), padB=28, padT=14, padR=10;
  const innerW = w-padL-padR, innerH = h-padT-padB;
  const steps = Math.round(range/tick);
  const stepX = n>1? innerW/(n-1) : 0;
  const maxLabels = Math.max(3, Math.floor(w/60));
  const pts = series.map((v,i)=>[padL+stepX*i, padT+innerH-((v-minV)/range)*innerH]);
  const zeroY = padT + innerH - ((0-minV)/range)*innerH;
  const path = pts.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area = `M${pts[0][0].toFixed(1)} ${zeroY.toFixed(1)} `+pts.map(p=>`L${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ')+` L${pts[pts.length-1][0].toFixed(1)} ${zeroY.toFixed(1)} Z`;
  let gridLines='', xLabels='';
  for(let i=0;i<=steps;i++){
    const y = padT + innerH*i/steps; const v = maxV - tick*i;
    gridLines += `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="var(--border)" stroke-width="1"/>`;
    gridLines += `<text x="${padL-6}" y="${y+4}" font-size="12.5" font-weight="600" text-anchor="end" fill="var(--text-dim)" font-family="IBM Plex Mono, monospace">${num(v)}</text>`;
  }
  labels.forEach((lab,i)=>{ if(n<=maxLabels || i%Math.ceil(n/maxLabels)===0) xLabels += xAxisLabel(pts[i][0], h-7, lab, w); });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;" role="img" ${chartAttr(wd=>svgLineChart(labels, series, color, {...opts, width:wd}))}>
    ${gridLines}
    <line x1="${padL}" y1="${zeroY}" x2="${w-padR}" y2="${zeroY}" stroke="var(--text-faint)" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="${area}" fill="${color}" opacity="0.14"/>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" style="filter:drop-shadow(0 0 5px ${color})"/>
    ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.8" fill="${color}"><title>${labels[i]}: ${num(series[i])}</title></circle>`).join('')}
    ${xLabels}
  </svg>`;
}
// width of a chart label in SVG user units (13px Space Grotesk, semibold — the same font stack as the
// SVG text); estimated when canvas is unavailable
let labelCanvas = null;
function labelWidth(text){
  try{
    labelCanvas = labelCanvas || document.createElement('canvas').getContext('2d');
    labelCanvas.font = '600 13px "Space Grotesk", sans-serif';
    return labelCanvas.measureText(text).width;
  }catch(e){ return Array.from(text).length*8; }
}
// user-perceived characters (a flag or an emoji with modifiers is never cut in half)
const graphemeSeg = (typeof Intl!=='undefined' && Intl.Segmenter) ? new Intl.Segmenter('pl', {granularity:'grapheme'}) : null;
function graphemes(s){ s = String(s); return graphemeSeg ? Array.from(graphemeSeg.segment(s), x=>x.segment) : Array.from(s); }
// a label that does not fit loses its middle ("Poczta Pol…Łódź"), so branches of one company stay distinguishable
function shortLabel(g, n){
  if(n >= g.length) return g.join('');
  const head = Math.max(1, Math.ceil(n*0.6)), tail = Math.max(0, n-head);
  return g.slice(0, head).join('').trimEnd() + '…' + (tail ? g.slice(g.length-tail).join('').trimStart() : '');
}
function fitLabel(text, avail){
  const g = graphemes(text);
  if(labelWidth(g.join('')) <= avail) return g.join('');
  let n = g.length - 1;
  while(n>1 && labelWidth(shortLabel(g, n)) > avail) n--;
  return shortLabel(g, n);
}
// Charts are drawn again at the real width of their panel once it is on screen (scale 1: 13px labels stay
// 13px and measured widths match what is drawn); a bar label still sticking out is shortened more.
// Each chart function registers how to draw itself at another width.
let chartDraws = [];
function chartAttr(draw){ return `data-chart="${chartDraws.push(draw) - 1}"`; }
function fitCharts(root){
  const list = chartDraws; chartDraws = [];
  if(!root) return;
  root.querySelectorAll('svg[data-chart]').forEach(svg=>{
    const draw = list[+svg.dataset.chart]; if(!draw) return;
    const real = Math.round(svg.getBoundingClientRect().width);
    if(!real) return;   // not laid out (hidden): leave it as it is
    let el = svg;
    if(real >= 200 && Math.abs(real - svg.viewBox.baseVal.width) > 2){
      const tmp = document.createElement('div'); tmp.innerHTML = draw(real); chartDraws = [];
      el = tmp.firstElementChild; svg.replaceWith(el);
    }
    el.querySelectorAll('text[data-full]').forEach(t=>{
      const g = graphemes(t.dataset.full); let n = graphemes(t.textContent).length;
      try{ let b; while(n>1 && (b = t.getBBox()).width > 0 && b.x < 1){ n--; t.textContent = shortLabel(g, n); } }catch(e){}
    });
  });
}
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ if(db && (currentView==='stats' || currentView==='courierDetail')) render(true); });
// width of a value label (12.5px IBM Plex Mono, semibold)
function valueWidth(text){
  try{
    labelCanvas = labelCanvas || document.createElement('canvas').getContext('2d');
    labelCanvas.font = '600 12.5px "IBM Plex Mono", monospace';
    return labelCanvas.measureText(text).width;
  }catch(e){ return String(text).length*7.6; }
}
// x-axis label: the last ones are anchored so they don't run past the right edge
function xAxisLabel(x, y, lab, w){
  const half = valueWidth(String(lab))/2;
  const anchor = x + half > w - 2 ? 'end' : 'middle', ax = anchor==='end' ? w - 2 : x;
  return `<text x="${ax}" y="${y}" font-size="12" font-weight="600" text-anchor="${anchor}" fill="var(--text-dim)" font-family="IBM Plex Mono, monospace">${lab}</text>`;
}
function svgHBar(items, opts={}){
  // first guess before layout (fitCharts then uses the panel's real width): in the two-column statistics
  // layout the panel is less than half the content width
  const w = opts.width || (window.innerWidth > 1200 ? 460 : chartWidth()), rowH=32, padT=6;
  // room on the right for the widest value (12 530 must not be cut)
  const padR = Math.round(Math.max(38, 8 + 4 + Math.max(0, ...items.map(it=>valueWidth(num(it.value))))));
  const longest = Math.max(0, ...items.map(it=>labelWidth(String(it.label))));
  const padL = Math.round(Math.min(w*0.42, Math.max(76, longest + 18)));
  const h = padT*2 + rowH*items.length;
  const max = Math.max(1, ...items.map(i=>i.value));
  let rows = '';
  items.forEach((it,i)=>{
    const y = padT + i*rowH; const barW = ((w-padL-padR) * it.value/max);
    const label = fitLabel(it.label, padL-14);
    rows += `
      <g><title>${escapeHtml(it.label)}: ${num(it.value)}</title>
      <text x="${padL-9}" y="${y+rowH/2+4.5}" font-size="13" font-weight="600" text-anchor="end" fill="var(--text)" font-family="Space Grotesk, sans-serif" data-full="${escapeHtml(it.label)}">${escapeHtml(label)}</text>
      <rect x="${padL}" y="${y+6}" width="${Math.max(2,barW)}" height="${rowH-12}" rx="4" fill="${it.color||'var(--accent)'}"/>
      <text x="${padL+barW+8}" y="${y+rowH/2+4.5}" font-size="12.5" font-weight="600" fill="var(--text-dim)" font-family="IBM Plex Mono, monospace">${num(it.value)}</text></g>
    `;
  });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;" role="img" ${chartAttr(wd=>svgHBar(items, {...opts, width:wd}))}>${rows}</svg>`;
}


/* ================================================================
   VIEW: STATYSTYKI
   ================================================================ */
function viewStats(){
  const {from,to} = periodBounds(statsPeriod);
  const periodTx = transactions.filter(t=> statsPeriod==='all' || inRange(t.data, from, to));
  const sumWydane = periodTx.filter(t=>t.typ==='wydanie').reduce((s,t)=>s+t.ilosc,0);
  const sumZwrot = periodTx.filter(t=>t.typ==='zwrot').reduce((s,t)=>s+t.ilosc,0);
  const opsCount = periodTx.length;
  const avgPerOp = opsCount? (periodTx.reduce((s,t)=>s+t.ilosc,0)/opsCount) : 0;
  const openingW = couriers.reduce((s,c)=>s+(c.openingWydane||0),0), openingZ = couriers.reduce((s,c)=>s+(c.openingZwrot||0),0);
  // for the whole period the rate counts the opening balance too, like "Niezwrócone łącznie" next to it
  const rateW = sumWydane + (statsPeriod==='all' ? openingW : 0), rateZ = sumZwrot + (statsPeriod==='all' ? openingZ : 0);
  const returnRate = rateW>0 ? (rateZ/rateW*100) : null;   // null = no issues in the period: rate undefined

  const byCourier = {};
  for(const t of periodTx){
    byCourier[t.kurierId] = byCourier[t.kurierId] || {id:t.kurierId, name:txCourierName(t), wydane:0, zwrot:0, color:(courierById(t.kurierId)||{}).color};
    if(t.typ==='wydanie') byCourier[t.kurierId].wydane += t.ilosc; else byCourier[t.kurierId].zwrot += t.ilosc;
  }
  const nowBal = {}; courierBalances().forEach(b=>{ nowBal[b.courier.id] = b.bilans; });
  const courierRows = Object.values(byCourier).map(c=>({...c, bilans:c.wydane-c.zwrot, now: nowBal[c.id]||0, share: sumWydane? (c.wydane/sumWydane*100):0})).sort((a,b)=>b.wydane-a.wydane);

  const weeksN = isNarrow()?8:14; const todayMon = weekStart(todayStr()); const weekKeys=[];
  for(let i=weeksN-1;i>=0;i--){ const d=new Date(todayMon); d.setDate(d.getDate()-7*i); weekKeys.push(toKey(d)); }
  const weekWyd = weekKeys.map(()=>0), weekZwr = weekKeys.map(()=>0);
  transactions.forEach(t=>{ const wk = toKey(weekStart(t.data)); const idx = weekKeys.indexOf(wk); if(idx>-1){ if(t.typ==='wydanie') weekWyd[idx]+=t.ilosc; else weekZwr[idx]+=t.ilosc; } });

  const monthsN = 12; const now = new Date(); const monthKeys=[];
  for(let i=monthsN-1;i>=0;i--){ const d=new Date(now.getFullYear(), now.getMonth()-i, 1); monthKeys.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`); }
  const sortedAll = [...transactions].sort((a,b)=>a.data.localeCompare(b.data));
  // the running balance starts from the opening balances, so its last point equals "Niezwrócone łącznie"
  const openingTotal = couriers.reduce((s,c)=> s + (c.openingWydane||0) - (c.openingZwrot||0), 0);
  const balByMonth = {};
  monthKeys.forEach(mk=>{ const upTo = sortedAll.filter(t=> monthKey(t.data) <= mk); balByMonth[mk] = openingTotal + upTo.reduce((s,t)=> s + (t.typ==='wydanie'? t.ilosc : -t.ilosc), 0); });
  const monthBalanceSeries = monthKeys.map(mk=>balByMonth[mk]);

  const wdCounts = [0,0,0,0,0,0,0]; // wydania only — this chart/insight is specifically about issuing, not returns
  const wdDates = [new Set(),new Set(),new Set(),new Set(),new Set(),new Set(),new Set()];
  transactions.forEach(t=>{
    if(t.typ!=='wydanie') return;
    const d=new Date(t.data+'T00:00:00'); const idx=(d.getDay()+6)%7;
    wdCounts[idx]+=t.ilosc; wdDates[idx].add(t.data);
  });
  const wdOccurrences = wdDates.map(s=>s.size);
  const wdAvg = wdCounts.map((sum,i)=> wdOccurrences[i]>0 ? sum/wdOccurrences[i] : 0);

  // best day = most pallets ISSUED on one date (returns used to be added in, inflating the number)
  const dayTotals = {}, dayReturns = {};
  transactions.forEach(t=>{ if(t.typ==='wydanie') dayTotals[t.data]=(dayTotals[t.data]||0)+t.ilosc; else dayReturns[t.data]=(dayReturns[t.data]||0)+t.ilosc; });
  let bestDay=null, bestDayVal=0;
  Object.entries(dayTotals).forEach(([d,v])=>{ if(v>bestDayVal){ bestDayVal=v; bestDay=d; } });
  const balances = courierBalances();
  const topOutstanding = balances.filter(b=>b.bilans>0).sort((a,b)=>b.bilans-a.bilans)[0] || null;
  const topVolume = [...balances].filter(b=>b.wydane>0).sort((a,b)=>b.wydane-a.wydane)[0];

  /* ---- podpowiedzi / insights ---- */
  // "typical Monday" should be judged by average per occurrence, not the raw sum — a weekday that
  // simply appeared more often in the date range would otherwise win purely by having more chances to add up
  let peakWeekdayIdx = -1, peakWeekdayAvg = 0;
  wdAvg.forEach((avg,i)=>{ if(avg>peakWeekdayAvg){ peakWeekdayAvg=avg; peakWeekdayIdx=i; } });
  const peakWeekdayVal = peakWeekdayIdx>=0 ? wdCounts[peakWeekdayIdx] : 0;
  const peakWeekdayOcc = peakWeekdayIdx>=0 ? wdOccurrences[peakWeekdayIdx] : 0;

  function sumWeeksAgo(startAgo, count, typ){
    let total=0;
    for(let i=0;i<count;i++){
      const d=new Date(todayMon); d.setDate(d.getDate()-7*(startAgo+i));
      const wk=toKey(d); const wEnd=addDays(wk,6);
      total += transactions.filter(t=>t.typ===typ && t.data>=wk && t.data<=wEnd).reduce((s,t)=>s+t.ilosc,0);
    }
    return total;
  }
  const last4W = sumWeeksAgo(1,4,'wydanie'), prev4W = sumWeeksAgo(5,4,'wydanie');
  const trendPct = pctChange(last4W, prev4W);

  const weekTotalsMap = {};
  transactions.forEach(t=>{ const wk=toKey(weekStart(t.data)); weekTotalsMap[wk]=weekTotalsMap[wk]||{w:0,z:0}; if(t.typ==='wydanie') weekTotalsMap[wk].w+=t.ilosc; else weekTotalsMap[wk].z+=t.ilosc; });
  const topWeeksList = Object.entries(weekTotalsMap).map(([wk,v])=>({wk,...v})).filter(x=>x.w>0).sort((a,b)=>b.w-a.w).slice(0,5);

  const monthTotalsMap = {};
  transactions.forEach(t=>{ const mk=monthKey(t.data); monthTotalsMap[mk]=monthTotalsMap[mk]||{w:0,z:0}; if(t.typ==='wydanie') monthTotalsMap[mk].w+=t.ilosc; else monthTotalsMap[mk].z+=t.ilosc; });
  const topMonthsList = Object.entries(monthTotalsMap).map(([mk,v])=>({mk,...v})).filter(x=>x.w>0).sort((a,b)=>b.w-a.w).slice(0,5);

  const d30=addDays(todayStr(),-30), d60=addDays(todayStr(),-60);
  const growthRows = couriers.map(c=>{
    const recent = transactions.filter(t=>t.kurierId===c.id && t.typ==='wydanie' && t.data>d30).reduce((s,t)=>s+t.ilosc,0);
    const prev = transactions.filter(t=>t.kurierId===c.id && t.typ==='wydanie' && t.data>d60 && t.data<=d30).reduce((s,t)=>s+t.ilosc,0);
    return {courier:c, recent, prev, delta:recent-prev};
  }).filter(r=>r.recent>0 || r.prev>0).sort((a,b)=>b.delta-a.delta);
  const grower = growthRows[0];

  // A week/month in progress is compared with the SAME number of days of the previous one
  // (Mon–today vs Mon–same weekday; 1st–today vs 1st–same day) — comparing a half-finished
  // week with a whole one always looked like a sharp drop.
  const sumIssued = (from,to)=> transactions.filter(t=>t.typ==='wydanie' && t.data>=from && t.data<=to).reduce((s,t)=>s+t.ilosc,0);
  const today = todayStr();
  const weekFrom = toKey(todayMon), weekDayIdx = daysBetween(weekFrom, today);
  const thisWeekW = sumIssued(weekFrom, today);
  const lastWeekW = sumIssued(addDays(weekFrom,-7), addDays(weekFrom,-7+weekDayIdx));
  const lastWeekFullW = sumWeeksAgo(1,1,'wydanie');

  const monthFrom = today.slice(0,8)+'01', dayOfMonth = now.getDate();
  const prevMonthDate = new Date(now.getFullYear(), now.getMonth()-1, 1);
  const prevMonthLastDay = new Date(now.getFullYear(), now.getMonth(), 0).getDate();
  const prevMonthFrom = toKey(prevMonthDate);
  const prevMonthSameDay = toKey(new Date(now.getFullYear(), now.getMonth()-1, Math.min(dayOfMonth, prevMonthLastDay)));
  const thisMonthW = sumIssued(monthFrom, today);
  const prevMonthW = sumIssued(prevMonthFrom, prevMonthSameDay);
  const prevMonthFullW = sumIssued(prevMonthFrom, toKey(new Date(now.getFullYear(), now.getMonth(), 0)));

  // every courier holding our pallets with no return for 14+ days (or none ever) — previously only the
  // single courier with the biggest balance was checked, so a lone stale courier further down was missed
  const staleCouriers = staleCourierList();

  const rateRows = couriers.map(c=>{
    const w = (c.openingWydane||0) + transactions.filter(t=>t.kurierId===c.id && t.typ==='wydanie').reduce((s,t)=>s+t.ilosc,0);
    const z = (c.openingZwrot||0) + transactions.filter(t=>t.kurierId===c.id && t.typ==='zwrot').reduce((s,t)=>s+t.ilosc,0);
    return {courier:c, w, z, rate: w>0? z/w*100 : null};
  }).filter(r=>r.rate!==null && r.w>=5);
  rateRows.sort((a,b)=>b.rate-a.rate);
  const bestRate = rateRows[0], worstRate = rateRows[rateRows.length-1];

  const activeDaysCount = new Set(transactions.filter(t=>t.typ==='wydanie').map(t=>t.data)).size;
  const avgPerActiveDay = activeDaysCount>0 ? (transactions.filter(t=>t.typ==='wydanie').reduce((s,t)=>s+t.ilosc,0)/activeDaysCount) : 0;

  const lifetimeBalances = courierBalances();
  const lifetimeWydane = lifetimeBalances.reduce((s,b)=>s+b.wydane,0);
  const lifetimeOutstanding = totalOutstanding();
  const outstandingRatio = (lifetimeWydane>0 && lifetimeOutstanding>0) ? (lifetimeOutstanding/lifetimeWydane*100) : 0;
  const earliestTx = transactions.reduce((m,t)=> !m || t.data<m ? t.data : m, null);

  const biggestOp = [...transactions].sort((a,b)=>b.ilosc-a.ilosc)[0];

  const lastTx = [...transactions].sort((a,b)=>b.data.localeCompare(a.data))[0];
  const daysSinceLastTx = lastTx ? daysBetween(lastTx.data, todayStr()) : null;

  // Each item: { tone: 'warn' | 'good' | 'info', text }
  // 'warn'  (amber ▲) — worth a look / needs attention
  // 'good'  (green ▼) — a favourable change
  // 'info'  (accent ●) — neutral, descriptive
  const insights = [];
  if(last4W>0 || prev4W>0){
    const prev4Start = addDays(toKey(todayMon), -56);
    if(prev4W===0 && (!earliestTx || earliestTx >= addDays(toKey(todayMon), -28))) insights.push({ tone:'info', text:`Ostatnie 4 pełne tygodnie: wydano <b>${num(last4W)} szt.</b> Wcześniejszych tygodni nie ma jeszcze w ewidencji, więc trendu nie da się policzyć.` });
    else if(prev4W===0) insights.push({ tone:'info', text:`W poprzednich 4 tygodniach (od ${fmtDate(prev4Start)}) nie było wydań, w ostatnich 4 pełnych tygodniach wydano <b>${num(last4W)} szt.</b>` });
    else if(last4W===prev4W) insights.push({ tone:'info', text:`Wydania w ostatnich 4 pełnych tyg. bez zmian względem poprzednich 4 tyg. (${num(prev4W)} → ${num(last4W)} szt.).` });
    else insights.push({ tone:'info', text:`Wydania ${last4W>prev4W?'rosną':'maleją'} o <b>${pctLabel(last4W,prev4W).replace(/^[+−-]/,'')}</b> w ostatnich 4 pełnych tyg. względem poprzednich 4 tyg. (${num(prev4W)} → ${num(last4W)} szt.).` });
  }
  if(transactions.length) insights.push({ tone:'info', text:`Ten tydzień (${weekDayIdx===0?'dziś':'pon.–dziś'}): wydano <b>${num(thisWeekW)} szt.</b>; w tych samych dniach poprzedniego tygodnia: ${num(lastWeekW)} szt. (${pctLabel(thisWeekW,lastWeekW)}). Cały poprzedni tydzień: ${num(lastWeekFullW)} szt.` });
  if(transactions.length) insights.push({ tone:'info', text:`Ten miesiąc (1.–${dayOfMonth}.): wydano <b>${num(thisMonthW)} szt.</b>; w tym samym okresie poprzedniego miesiąca: ${num(prevMonthW)} szt. (${pctLabel(thisMonthW,prevMonthW)}). Cały poprzedni miesiąc: ${num(prevMonthFullW)} szt.` });
  if(peakWeekdayIdx>=0 && peakWeekdayOcc>0) insights.push({ tone:'info', text:`<b>${WEEKDAYS_PL[peakWeekdayIdx]}</b> to Twój najbardziej pracowity dzień tygodnia — średnio <b>${fmt1(peakWeekdayAvg)} szt.</b> wydania (łącznie ${num(peakWeekdayVal)} szt. z ${peakWeekdayOcc} ${peakWeekdayOcc===1?'dnia, w którym były':'dni, w które były'} wydania).` });
  if(topMonthsList[0]) insights.push({ tone:'info', text:`Najbardziej aktywny miesiąc: <b>${monthLabel(topMonthsList[0].mk)}</b> — wydano ${num(topMonthsList[0].w)} szt.` });
  if(avgPerActiveDay>0) insights.push({ tone:'info', text:`Średnio wydajesz <b>${fmt1(avgPerActiveDay)} szt.</b> w dniu, w którym w ogóle są wydania.` });
  if(grower && grower.delta!==0) insights.push({ tone: grower.delta>0?'info':'good', text:`<b>${escapeHtml(grower.courier.name)}</b> ${grower.delta>0?'zwiększył':'zmniejszył'} odbiór palet o <b>${num(Math.abs(grower.delta))}</b> szt. (ost. 30 dni vs poprz. 30 dni).` });
  if(bestRate && worstRate && bestRate.courier.id!==worstRate.courier.id) insights.push({ tone:'info', text:`Najlepszy wskaźnik zwrotów (od początku, ze stanem początkowym): <b>${escapeHtml(bestRate.courier.name)}</b> (${pctText(bestRate.rate)}). Najsłabszy: <b>${escapeHtml(worstRate.courier.name)}</b> (${pctText(worstRate.rate)}).` });
  if(outstandingRatio>0 && Math.round(outstandingRatio)<=15) insights.push({ tone:'good', text:`Tylko <b>${pctText(outstandingRatio)}</b> wszystkich kiedykolwiek wydanych palet jest wciąż niezwrócone (${num(lifetimeOutstanding)} szt.) — rozliczenia idą na bieżąco.` });

  // alerts — the same shape, but genuinely need attention, shown in their own panel
  const alerts = [];
  staleCouriers.forEach(b=> alerts.push({ tone:'warn', text: b.info.status==='never'
      ? `<b>${escapeHtml(b.courier.name)}</b> nie zwrócił jeszcze żadnej palety — ma u siebie ${num(b.bilans)} szt.`
      : `<b>${escapeHtml(b.courier.name)}</b> nie oddał żadnej palety od <b>${b.info.days} dni</b> (ostatni zwrot: ${fmtDate(b.info.date)}) — ma u siebie ${num(b.bilans)} szt.` }));
  if(returnRate!==null && Math.round(returnRate)<70 && lifetimeOutstanding>0) alerts.push({ tone:'warn', text:`Wskaźnik zwrotów w wybranym okresie to tylko <b>${pctText(returnRate)}</b> (zwrócono ${num(rateZ)} z ${num(rateW)} szt. wydanych${statsPeriod==='all' && (openingW||openingZ) ? ', ze stanem początkowym' : ''}) — warto sprawdzić zaległe palety u kurierów.` });
  if(Math.round(outstandingRatio)>=45) alerts.push({ tone:'warn', text:`Aż <b>${pctText(outstandingRatio)}</b> wszystkich kiedykolwiek wydanych palet jest wciąż niezwrócone (${num(lifetimeOutstanding)} szt.) — spory zator w rozliczeniach.` });
  if(daysSinceLastTx!==null && daysSinceLastTx>=5) alerts.push({ tone:'warn', text:`Brak jakiejkolwiek operacji od <b>${dni(daysSinceLastTx)}</b> (ostatnia: ${fmtDate(lastTx.data)}) — sprawdź, czy ewidencja jest na bieżąco.` });

  function insightRow(ins){
    const color = ins.tone==='warn'?'var(--bad)':(ins.tone==='good'?'var(--good)':'var(--accent-strong)');
    const icon = ins.tone==='warn'?'▲':(ins.tone==='good'?'▼':'●');
    const legend = ins.tone==='warn'?'Warto zwrócić uwagę':(ins.tone==='good'?'Zmiana na plus':'Informacja');
    return `
      <div style="display:flex; align-items:flex-start; gap:10px; font-size:13.5px; color:var(--text-dim); line-height:1.5;" title="${legend}">
        <span style="flex-shrink:0; margin-top:1px; font-family:'IBM Plex Mono',monospace; font-weight:700; color:${color};">${icon}</span>
        <span>${ins.text}</span>
      </div>`;
  }

  return `
    <div class="view-head">
      <div><h1>Statystyki</h1><p>Kliknij kuriera, aby zobaczyć szczegółowy rozkład tygodni i miesięcy.${historyComplete?'':' <span style="color:var(--bad)">Wczytywanie starszej historii — liczby mogą być jeszcze niepełne.</span>'}</p></div>
      <div class="period-tabs">
        ${[['week','Tydzień'],['month','Miesiąc'],['year','Rok'],['all','Cały okres']].map(([k,l])=>`<button class="${statsPeriod===k?'active':''}" data-period="${k}">${l}</button>`).join('')}
      </div>
    </div>

    <div class="grid kpi-grid" style="margin-bottom:16px;">
      <div class="kpi"><div class="lbl">Wydane w okresie</div><div class="val" style="color:var(--bad)">${num(sumWydane)}</div><div class="sub">${statsPeriod==='all' && openingW ? `szt. + ${num(openingW)} ze stanu początkowego` : 'szt.'}</div></div>
      <div class="kpi"><div class="lbl">Zwrócone w okresie</div><div class="val" style="color:var(--good)">${num(sumZwrot)}</div><div class="sub">${statsPeriod==='all' && openingZ ? `szt. + ${num(openingZ)} ze stanu początkowego` : 'szt.'}</div></div>
      <div class="kpi"><div class="lbl">Liczba operacji</div><div class="val">${num(opsCount)}</div><div class="sub">śr. ${fmt1(avgPerOp)} szt./op.</div></div>
      <div class="kpi"><div class="lbl">Wskaźnik zwrotów</div><div class="val">${pctText(returnRate)}</div><div class="sub">${returnRate===null ? 'brak wydań w okresie' : 'zwrócone / wydane w okresie'+(statsPeriod==='all' && (openingW||openingZ) ? ', ze stanem pocz.' : '')}</div></div>
      <div class="kpi"><div class="lbl">Niezwrócone łącznie</div><div class="val" style="color:${lifetimeOutstanding<=0?'var(--good)':(outstandingRatio>35?'var(--bad)':(outstandingRatio>15?'var(--info)':'var(--good)'))}">${num(lifetimeOutstanding)}</div><div class="sub">${lifetimeOutstanding>0 ? `${pctText(outstandingRatio)} wszystkich kiedykolwiek wydanych` : lifetimeOutstanding<0 ? `zwrócono o ${num(-lifetimeOutstanding)} szt. więcej, niż wydano` : 'wszystko rozliczone'}</div></div>
    </div>

    ${alerts.length? `
    <div class="panel" style="border-color:color-mix(in srgb, var(--bad) 45%, var(--border));">
      <div class="panel-title"><h2 style="padding-left:11px;">Alerty</h2><span class="hint">${num(alerts.length)} ${plForm(alerts.length,'sprawa wymaga','sprawy wymagają','spraw wymaga')} uwagi</span></div>
      <div style="display:flex; flex-direction:column; gap:9px;">${alerts.map(insightRow).join('')}</div>
    </div>` : ''}

    <div class="panel">
      <div class="panel-title"><h2>Podpowiedzi</h2><span class="hint">automatyczne obserwacje na podstawie danych</span></div>
      ${insights.length? `
      <div style="display:flex; flex-wrap:wrap; gap:14px; margin-bottom:14px; padding-bottom:12px; border-bottom:1px solid var(--border); font-size:12.5px; color:var(--text-faint);">
        <span style="display:flex; align-items:center; gap:5px;"><span style="font-family:'IBM Plex Mono',monospace; font-weight:700; color:var(--bad);">▲</span>warto zwrócić uwagę</span>
        <span style="display:flex; align-items:center; gap:5px;"><span style="font-family:'IBM Plex Mono',monospace; font-weight:700; color:var(--good);">▼</span>zmiana na plus</span>
        <span style="display:flex; align-items:center; gap:5px;"><span style="font-family:'IBM Plex Mono',monospace; font-weight:700; color:var(--accent-strong);">●</span>informacja</span>
      </div>
      <div style="display:flex; flex-direction:column; gap:9px;">${insights.map(insightRow).join('')}</div>
      ` : `<div class="empty" style="padding:20px;">${ICONS.chart}<p>Zbierz więcej danych, aby zobaczyć podpowiedzi</p></div>`}
    </div>

    <div class="grid stats-grid-2">
      <div class="panel">
        <div class="panel-title"><h2>Top 5 tygodni</h2><span class="hint">wg wydanych palet</span></div>
        ${topWeeksList.length? topWeeksList.map((w,i)=>`
          <div class="week-row" style="cursor:default;">
            <div class="rng"><span class="mono" style="color:var(--text-faint); width:16px; display:inline-block;">${i+1}.</span>${weekLabel(w.wk, true)}</div>
            <div class="stats"><span style="color:var(--bad)">+${num(w.w)}</span><span style="color:var(--good)">−${num(w.z)}</span></div>
          </div>`).join('') : `<div class="empty" style="padding:16px;"><p>Brak danych</p></div>`}
      </div>
      <div class="panel">
        <div class="panel-title"><h2>Top 5 miesięcy</h2><span class="hint">wg wydanych palet</span></div>
        ${topMonthsList.length? topMonthsList.map((m,i)=>`
          <div class="week-row" style="cursor:default;">
            <div class="rng"><span class="mono" style="color:var(--text-faint); width:16px; display:inline-block;">${i+1}.</span>${monthLabel(m.mk)}</div>
            <div class="stats"><span style="color:var(--bad)">+${num(m.w)}</span><span style="color:var(--good)">−${num(m.z)}</span></div>
          </div>`).join('') : `<div class="empty" style="padding:16px;"><p>Brak danych</p></div>`}
      </div>
    </div>

    <div class="panel">
      <div class="panel-title"><h2>Zestawienie wg kuriera</h2><span class="hint">kliknij, aby zobaczyć szczegóły →</span></div>
      ${courierRows.length? `
      <div class="table-wrap">
        <table class="table-card">
          <thead><tr><th>Kurier</th><th class="num">Wydane</th><th class="num">Zwrócone</th><th class="num" title="Wydane minus zwrócone w wybranym okresie (bez stanu początkowego).">Różnica w okresie</th><th class="num" title="Ile palet kurier ma u siebie dzisiaj (łącznie ze stanem początkowym).">Bilans dziś</th><th class="num">Udział</th></tr></thead>
          <tbody>
            ${courierRows.map(c=>`
              <tr class="clickable" data-action="open-courier" data-id="${escapeHtml(c.id)}">
                <td data-label="Kurier"><button type="button" class="link-btn" id="cr-${escapeHtml(c.id)}" title="Szczegóły kuriera">${courierBadge(courierById(c.id)||{name:c.name,color:c.color},22)}${escapeHtml(c.name)}</button></td>
                <td class="num" data-label="Wydane">${num(c.wydane)}</td>
                <td class="num" data-label="Zwrócone">${num(c.zwrot)}</td>
                <td class="num" data-label="Różnica w okresie" style="color:${c.bilans>0?'var(--bad)':(c.bilans<0?'var(--info)':'var(--good)')}">${c.bilans>0?'+':''}${num(c.bilans)}</td>
                <td class="num" data-label="Bilans dziś" style="color:${c.now>0?'var(--bad)':(c.now<0?'var(--info)':'var(--good)')}">${c.now>0?'+':''}${num(c.now)}</td>
                <td class="num" data-label="Udział">${fmt1(c.share)}%</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>` : `<div class="empty">${ICONS.chart}<h3>Brak danych w tym okresie</h3></div>`}
    </div>

    <div class="grid stats-grid-2">
      <div class="panel">
        <div class="panel-title"><h2>Trend tygodniowy</h2><span class="hint">ost. ${weeksN} tyg.</span></div>
        <div class="chart-legend"><div class="item"><span class="dot" style="background:var(--bad)"></span>Wydania</div><div class="item"><span class="dot" style="background:var(--good)"></span>Zwroty</div></div>
        ${svgBarChartGrouped(weekKeys.map(weekLabelShort), weekWyd, weekZwr, 'var(--bad)','var(--good)')}
      </div>
      <div class="panel">
        <div class="panel-title"><h2>Bilans narastająco</h2><span class="hint">stan na koniec miesiąca${openingTotal? ', ze stanem początkowym':''}</span></div>
        ${svgLineChart(monthKeys.map(monthLabel), monthBalanceSeries, 'var(--accent)')}
      </div>
    </div>

    <div class="grid stats-grid-2 wide-right">
      <div class="panel">
        <div class="panel-title"><h2>Rozkład wg dnia tygodnia</h2><span class="hint">średnio szt. wydanych w dniu z wydaniami</span></div>
        ${svgHBar(WEEKDAYS_PL_SHORT.map((l,i)=>({label:l, value:Math.round(wdAvg[i]*10)/10, color:'var(--info)'})))}
      </div>
      <div class="panel">
        <div class="panel-title"><h2>Udział kurierów w wydaniach</h2><span class="hint">wybrany okres</span></div>
        ${courierRows.length? svgHBar(courierRows.slice(0,8).map((c,i)=>({label:c.name, value:c.wydane, color:COURIER_COLORS[i%COURIER_COLORS.length]}))) : `<div class="empty" style="padding:20px;">${ICONS.box}<p>Brak danych</p></div>`}
      </div>
    </div>

    <div class="panel-title"><h2>Rekordy</h2><span class="hint">cały zarejestrowany okres</span></div>
    <div class="grid records-grid">
      <div class="panel record-card"><div class="lbl">Dzień z największym wydaniem</div><div class="val">${bestDay? fmtDate(bestDay) : '—'}</div><div class="sub">${bestDay? 'wydano '+num(bestDayVal)+' szt.'+(dayReturns[bestDay]? ` (tego dnia też ${num(dayReturns[bestDay])} szt. zwrotów)`:'') : 'brak danych'}</div></div>
      <div class="panel record-card"><div class="lbl">Największy bilans u kuriera</div><div class="val" style="color:var(--bad)">${topOutstanding? escapeHtml(topOutstanding.courier.name):'—'}</div><div class="sub">${topOutstanding? palet(topOutstanding.bilans)+' u kuriera' : 'nikt nie ma naszych palet'}</div></div>

/* ================================================================

   ================================================================ */
function weekDaysInfo(offsetWeeks){
  const base = weekStart(todayStr());
  const monday = new Date(base); monday.setDate(monday.getDate()+7*offsetWeeks);
  const days = []; for(let i=0;i<7;i++){ const d=new Date(monday); d.setDate(d.getDate()+i); days.push(toKey(d)); }
  return days;
}
function weeksOverlappingMonth(year, monthIdx){
  const first = new Date(year, monthIdx, 1);
  const last = new Date(year, monthIdx+1, 0);
  let mon = weekStart(toKey(first));
  const weeks = [];
  while(mon <= last){
    weeks.push(toKey(mon));
    mon = new Date(mon); mon.setDate(mon.getDate()+7);
  }
  return weeks;
}

// Statement for one courier between two dates: balance before the range (opening balance + every
// earlier operation), operations inside the range with a running balance, and the closing balance.
function courierStatement(id, from, to){
  const c = courierById(id) || {};
  const opening = (c.openingWydane||0) - (c.openingZwrot||0);
  const all = transactions.filter(t=>t.kurierId===id).sort((a,b)=> a.data.localeCompare(b.data) || (a.createdAt||0)-(b.createdAt||0));
  let bal = opening, w = 0, z = 0; const rows = [];
  for(const t of all){ if(from && t.data<from) bal += t.typ==='wydanie' ? t.ilosc : -t.ilosc; }
  const startBal = bal;
  for(const t of all){
    if((from && t.data<from) || (to && t.data>to)) continue;
    bal += t.typ==='wydanie' ? t.ilosc : -t.ilosc;
    if(t.typ==='wydanie') w += t.ilosc; else z += t.ilosc;
    rows.push({t, bal});
  }
  return {opening, startBal, endBal:bal, w, z, rows};
}

      ${st.rows.length? st.rows.map(r=>`<tr><td>${fmtDate(r.t.data)}</td><td>${escapeHtml(map[r.t.id]||'')}</td><td>${r.t.typ==='wydanie'?'wydanie':'zwrot'}</td><td class="n">${r.t.typ==='wydanie'?num(r.t.ilosc):''}</td><td class="n">${r.t.typ==='zwrot'?num(r.t.ilosc):''}</td><td class="n">${num(r.bal)}</td><td>${escapeHtml(r.t.uwagi||'')}</td></tr>`).join('') : `<tr><td colspan="7">Brak operacji w tym okresie.</td></tr>`}

function lastBackupInfo(){ try{ return localStorage.getItem('ep-last-backup')||''; }catch(e){ return ''; } }

function dataIssues(){
  const issues = []; const map = buildDocketMap();
  // possible double entries: same courier, type, quantity and date saved within 15 minutes
  const groups = {};
  [...transactions].sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)).forEach(t=>{ const k=[t.kurierId,t.typ,t.ilosc,t.data].join('|'); (groups[k]=groups[k]||[]).push(t); });
  Object.values(groups).forEach(g=>{
    for(let i=1;i<g.length;i++){
      const a=g[i-1], b=g[i];
      // twinOk: the user confirmed the repeat ("Zapisz ponownie") or marked it "To nie duplikat"
      if(a.createdAt && b.createdAt && b.createdAt-a.createdAt < 15*60000 && !b.twinOk){
        issues.push({level:'warn', text:`Możliwy podwójny wpis: <b>${escapeHtml(map[a.id]||'')}</b> i <b>${escapeHtml(map[b.id]||'')}</b> — ${escapeHtml(txCourierName(b))}, ${b.typ==='wydanie'?'wydanie':'zwrot'}, ${palet(b.ilosc)}, ${fmtDate(b.data)}, zapisane w odstępie ${Math.max(1,Math.round((b.createdAt-a.createdAt)/60000))} min.`,
          actions:[{label:'Pokaż', act:'edit', id:b.id},{label:'To nie duplikat', act:'twin-ok', id:b.id},{label:'Usuń drugi wpis', act:'delete', id:b.id}]});
      }
    }
  });
  // the same document number on two operations (two devices saving at the same moment)
  const byNr = {}; transactions.forEach(t=>{ const nr = map[t.id]; if(nr) (byNr[nr]=byNr[nr]||[]).push(t); });
  Object.entries(byNr).forEach(([nr,list])=>{
    if(list.length>1){
      const sorted = list.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
      issues.push({level:'warn', text:`Numer dokumentu <b>${escapeHtml(nr)}</b> ma ${opsLabel(list.length)} (np. po połączeniu kopii albo zapisie w tej samej chwili z dwóch urządzeń).`, actions:[{label:'Nadaj nowe numery', act:'renumber', ids:sorted.slice(1).map(t=>t.id).join(',')}]});
    }
  });
  // more returned than issued
  courierBalances().forEach(b=>{
    if(b.bilans<0) issues.push({level:'warn', text:`<b>${escapeHtml(b.courier.name)}</b>: zwrócono o ${num(-b.bilans)} szt. więcej, niż wydano. Brakuje wpisu wydania albo stanu początkowego?`, actions: courierById(b.courier.id) ? [{label:'Szczegóły', act:'courier', id:b.courier.id}] : []});
  });
  // operations of deleted couriers
  const orphans = {};
  transactions.forEach(t=>{ if(!courierById(t.kurierId)){ const o = orphans[t.kurierId] = orphans[t.kurierId] || {name:t.kurierNazwa||t.kurierId, n:0, bal:0}; o.n++; o.bal += t.typ==='wydanie' ? t.ilosc : -t.ilosc; } });
  Object.entries(orphans).forEach(([id,o])=> issues.push({level:'info', text:`${opsLabel(o.n)} usuniętego kuriera „${escapeHtml(o.name)}” (bilans ${o.bal>0?'+':''}${num(o.bal)}) — ${plForm(o.n,'nadal liczy się','nadal liczą się','nadal liczy się')} do sumy palet u kurierów.`, actions:[{label:'Przywróć kuriera', act:'restore-courier', id, name:o.name}]}));
  // odd values
  transactions.forEach(t=>{
    if(!Number.isInteger(t.ilosc) || t.ilosc<1) issues.push({level:'warn', text:`Operacja <b>${escapeHtml(map[t.id]||'')}</b> ma nieprawidłową ilość (${escapeHtml(t.ilosc)}).`, actions:[{label:'Popraw', act:'edit', id:t.id}]});
    else if(t.data > todayStr()) issues.push({level:'warn', text:`Operacja <b>${escapeHtml(map[t.id]||'')}</b> ma datę z przyszłości (${fmtDate(t.data)}).`, actions:[{label:'Popraw', act:'edit', id:t.id}]});
  });
  invalidTx.forEach(t=> issues.push({level:'warn', text:`Uszkodzony wpis operacji (id ${escapeHtml(t.id)}) — brak daty, typu lub ilości; nie jest liczony w bilansach.`, actions:[{label:'Usuń wpis', act:'delete-raw', id:t.id}]}));
  return issues;
}

async function exportBackup(){
  if(!historyComplete){ toast('Poczekaj chwilę, aż wczyta się cała historia', true); return; }
  const logos = {};
  for(const c of couriers){
    if(!c.logoAssetId) continue;
    const src = assetSrc(c.logoAssetId); if(!src) continue;
    try{ const r = await fetch(src); if(r.ok) logos[c.logoAssetId] = await blobToDataUrl(await r.blob()); }
    catch(e){ console.warn('Nie udało się dołączyć logo', c.id, e); }
  }
  const backup = {
    app:'ewidencja-palet', format:1, exportedAt:new Date().toISOString(), source:runtimeInfo().mode, appVersion:APP_VERSION,
    couriers: couriers.map(c=>({...c})), transactions: [...transactions, ...invalidTx].map(t=>({...t})),
    meta:{counters: counters||{}}, logos,
  };
  const ok = await saveFile(`ewidencja-palet-kopia-${todayStr()}.json`, JSON.stringify(backup, null, 1), 'application/json');
  if(ok){
    try{ localStorage.setItem('ep-last-backup', `${fmtDate(todayStr())}, ${new Date().toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'})}`); }catch(e){}
    toast(`Kopia gotowa: ${opsLabel(transactions.length)}, kurierzy: ${couriers.length}`);
    if(currentView==='settings') render();
  }
}

function parseBackup(text){
  let j; try{ j = JSON.parse(text); }catch(e){ throw new Error('To nie jest prawidłowy plik JSON.'); }
  if(!j || j.app!=='ewidencja-palet' || !Array.isArray(j.transactions) || !Array.isArray(j.couriers)) throw new Error('To nie jest plik kopii Ewidencji Palet.');
  const ID = /^[A-Za-z0-9_\-.~:@+]{1,200}$/;
  const out = {exportedAt:j.exportedAt||'', couriers:[], transactions:[], skipped:0, counters:{}, logos:(j.logos && typeof j.logos==='object') ? j.logos : {}};
  const jc = (j.meta && j.meta.counters) || {};
  ['wz','pz'].forEach(k=>{ const v = Number(jc[k]); if(Number.isSafeInteger(v) && v>=0 && v<=9999999) out.counters[k] = v; });
  j.couriers.forEach(c=>{
    if(!(c && typeof c.id==='string' && ID.test(c.id) && typeof c.name==='string' && c.name.trim())){ out.skipped++; return; }
    const d = {name:c.name.trim().slice(0,60), order:Number.isFinite(c.order)? c.order : 0, color:safeColor(c.color, COURIER_COLORS[0]), custom:!!c.custom, enabled:c.enabled!==false};
    if(Number.isInteger(c.openingWydane) && c.openingWydane>0) d.openingWydane = c.openingWydane;
    if(Number.isInteger(c.openingZwrot) && c.openingZwrot>0) d.openingZwrot = c.openingZwrot;
    if(typeof c.logoAssetId==='string' && c.logoAssetId) d.logoAssetId = c.logoAssetId;
    if(c.noLogo===true) d.noLogo = true;
    out.couriers.push({id:c.id, data:d});
  });
  j.transactions.forEach(t=>{
    if(!(t && typeof t.id==='string' && ID.test(t.id) && (t.typ==='wydanie'||t.typ==='zwrot') && Number.isInteger(t.ilosc) && t.ilosc>0 && typeof t.data==='string' && /^\d{4}-\d{2}-\d{2}$/.test(t.data) && typeof t.kurierId==='string' && ID.test(t.kurierId))){ out.skipped++; return; }
    const d = {kurierId:t.kurierId, kurierNazwa:String(t.kurierNazwa||'').slice(0,60), typ:t.typ, ilosc:t.ilosc, data:t.data, uwagi:String(t.uwagi||'').slice(0,500), createdAt: Number.isFinite(t.createdAt)? t.createdAt : (Date.parse(t.data)||0)};
    // a number from the file is kept only when it fits (right kind, sane size); otherwise it gets a new one
    if(typeof t.nr==='string' && /^(WZ|PZ)-\d{1,7}$/.test(t.nr) && t.nr.startsWith(docketPrefix(t.typ)) && docketNum(t.nr)>0) d.nr = padNr(t.typ, docketNum(t.nr));
    if(d.nr && Number.isFinite(t.nrAt)) d.nrAt = t.nrAt;
    if(t.twinOk===true) d.twinOk = true;
    if(t.numerListu) d.numerListu = String(t.numerListu).slice(0,100);
    out.transactions.push({id:t.id, data:d});
  });
  return out;
}

let importRunning = false;
// Plan for "Połącz": existing couriers keep their name/colour/order, but get the opening balance and
// logo from the file where they have none; file operations whose document number is already used here
// by another operation get a new number instead of creating a duplicate.
function planMerge(parsed){
  const cById = new Map(couriers.map(c=>[c.id,c]));
  const txIds = new Set(transactions.map(t=>t.id));
  const map = buildDocketMap();
  const usedNr = new Map(); transactions.forEach(t=>{ if(map[t.id]) usedNr.set(map[t.id], t.id); });
  const fills = [], differ = [];
  parsed.couriers.forEach(fc=>{
    const lc = cById.get(fc.id); if(!lc || isUntouchedDefault(lc)) return;
    const patch = {};
    if(!lc.openingWydane && fc.data.openingWydane) patch.openingWydane = fc.data.openingWydane;
    if(!lc.openingZwrot && fc.data.openingZwrot) patch.openingZwrot = fc.data.openingZwrot;
    if(!lc.logoAssetId && !lc.noLogo && fc.data.logoAssetId && parsed.logos[fc.data.logoAssetId]) patch.logoAssetId = fc.data.logoAssetId;
    if(Object.keys(patch).length) fills.push({id:fc.id, name:lc.name, patch});
    const diffs = [];
    if((fc.data.name||'')!==(lc.name||'')) diffs.push(`nazwa w pliku „${fc.data.name}”`);
    if(lc.openingWydane && fc.data.openingWydane && lc.openingWydane!==fc.data.openingWydane) diffs.push(`stan początkowy wydanych w pliku ${num(fc.data.openingWydane)}`);
    if(lc.openingZwrot && fc.data.openingZwrot && lc.openingZwrot!==fc.data.openingZwrot) diffs.push(`stan początkowy zwróconych w pliku ${num(fc.data.openingZwrot)}`);
    if((fc.data.enabled!==false)!==(lc.enabled!==false)) diffs.push(fc.data.enabled===false ? 'w pliku nieaktywny' : 'w pliku aktywny');
    if(diffs.length) differ.push({name:lc.name, diffs});
  });
  const renumber = parsed.transactions.filter(t=> !txIds.has(t.id) && t.data.nr && usedNr.has(t.data.nr) && usedNr.get(t.data.nr)!==t.id).map(t=>t.id);
  // the same number on two new operations of the file: the later one (by creation time) gets a new number
  const taken = renumber.length;
  const inFile = new Set();
  let dupInFile = 0;
  parsed.transactions.filter(t=> !txIds.has(t.id) && t.data.nr).sort((a,b)=>(a.data.createdAt||0)-(b.data.createdAt||0))
    .forEach(t=>{ if(inFile.has(t.data.nr)){ if(!renumber.includes(t.id)){ renumber.push(t.id); dupInFile++; } } else inFile.add(t.data.nr); });
  // operations from old copies without a number get one during the import as well
  const noNr = parsed.transactions.filter(t=> !txIds.has(t.id) && !hasValidNr(t.data)).length;
  return {fills, differ, renumber, taken, dupInFile, noNr};
}
// a default courier only auto-created on first start and never changed in any way
function isUntouchedDefault(c){
  const d = DEFAULT_COURIERS.find(x=>x.id===c.id);
  return !!d && !c.custom && c.name===d.name && (c.color||'').toLowerCase()===d.color.toLowerCase() && c.enabled!==false && !c.noLogo && !c.logoAssetId
    && c.order===d.order && !c.openingWydane && !c.openingZwrot && !transactions.some(t=>t.kurierId===c.id);
}
function isFreshInstall(){ return !transactions.length && !invalidTx.length && couriers.every(isUntouchedDefault); }
async function importBackupFile(file){
  if(!file) return;
  if(!historyComplete){ toast('Poczekaj chwilę, aż wczyta się cała historia', true); return; }

  try{ parsed = parseBackup(await file.text()); }catch(e){ toast(e.message, true); return; }
  const fresh = isFreshInstall();
  const plan = planMerge(parsed);
  const txIds = new Set(transactions.map(t=>t.id));
  const common = parsed.transactions.filter(t=>txIds.has(t.id)).length;
  const dates = parsed.transactions.map(t=>t.data.data).sort();
  const when = parsed.exportedAt ? new Date(parsed.exportedAt) : null;
  openModal(`
    <h2>Wczytać kopię?</h2>
    <div class="modal-sub">Plik${when && !isNaN(when) ? ` z ${when.toLocaleDateString('pl-PL')} ${when.toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'})}` : ''}: kurierzy ${num(parsed.couriers.length)}, ${opsLabel(parsed.transactions.length)}${dates.length ? ` (${fmtDate(dates[0])} – ${fmtDate(dates[dates.length-1])})` : ''}.${parsed.skipped ? ` Pominięto uszkodzone wpisy: ${num(parsed.skipped)}.` : ''}<br>Teraz w aplikacji: kurierzy ${num(couriers.length)}, ${opsLabel(transactions.length)}; te same operacje w obu: ${num(common)}.</div>
    <div style="display:flex; flex-direction:column; gap:10px;">
      <label class="import-opt"><input type="radio" name="importMode" value="merge" ${fresh ? '' : 'checked'}><span><b>Połącz</b> — dodaj z pliku tylko to, czego tu brakuje. Nic nie zostanie usunięte ani nadpisane.${
        (plan.fills.length || plan.differ.length || plan.renumber.length || plan.noNr) ? `<span style="display:block; margin-top:6px; font-size:12.5px;">${[
          plan.fills.length ? `Uzupełnione z pliku (tu brak): ${plan.fills.map(f=>escapeHtml(f.name)).join(', ')} — stan początkowy lub logo.` : '',
          plan.differ.length ? `Zostaną tutejsze ustawienia: ${plan.differ.map(d=>`${escapeHtml(d.name)} (${d.diffs.map(escapeHtml).join(', ')})`).join('; ')}.` : '',
          (plan.renumber.length + plan.noNr) ? (()=>{ const total = plan.renumber.length + plan.noNr;
            const why = [plan.taken ? `numer zajęty tutaj przez inną operację: ${num(plan.taken)}` : '', plan.dupInFile ? `ten sam numer dwa razy w pliku: ${num(plan.dupInFile)}` : '', plan.noNr ? `bez numeru (starsza kopia): ${num(plan.noNr)}` : ''].filter(Boolean).join(', ');
            const txt = `${opsLabel(total)} z pliku ${plForm(total,'dostanie nowy numer dokumentu','dostaną nowe numery dokumentów','dostanie nowe numery dokumentów')} (${why}).`;
            return plan.taken ? `<b style="color:var(--bad);">${txt}</b> Przy przenoszeniu z wersji online wybierz raczej „Zastąp wszystko”.` : txt; })() : '',
        ].filter(Boolean).join('<br>')}</span>` : ''}</span></label>
      <label class="import-opt"><input type="radio" name="importMode" value="replace" ${fresh ? 'checked' : ''}><span><b>Zastąp wszystko</b> — usuń obecnych kurierów i operacje i odtwórz dokładnie stan z pliku.</span></label>
    </div>
    <div class="modal-close-row"><button type="button" class="btn" data-action="close-modal">Anuluj</button><button type="button" class="btn btn-primary" id="importGo">${ICONS.upload}Wczytaj</button></div>
  `);
  document.querySelector('#modalRoot [data-action="close-modal"]').addEventListener('click', closeModal);
  document.getElementById('importGo').addEventListener('click', async ()=>{
    const mode = (document.querySelector('#modalRoot input[name=importMode]:checked')||{}).value || 'merge';
    closeModal();
    if(mode==='replace'){
      const ok = isFreshInstall() || await confirmDialog('Zastąpić wszystkie dane?', `Obecni kurierzy (${num(couriers.length)}, razem ze stanem początkowym i ustawieniami) i operacje (${opsLabel(transactions.length)}) zostaną usunięci i zastąpieni zawartością pliku. Jeśli nie masz kopii obecnych danych, anuluj i najpierw ją pobierz.`, {okLabel:'Zastąp'});
      if(!ok) return;
    }
    runImport(parsed, mode);
  });
}

async function runImport(parsed, mode){
  if(movingOps){ toast('Trwa przenoszenie operacji — spróbuj za chwilę', true); return; }
  const info = runtimeInfo();
  const txById = new Map(transactions.map(t=>[t.id,t])), cById = new Map(couriers.map(c=>[c.id,c]));
  // a default courier that was only auto-created (never renamed, used, given a logo or an opening
  // balance) is replaced by the file's version even in "Połącz" mode — otherwise importing into a
  // fresh install would silently drop names, opening balances and on/off settings from the backup
  const addC = parsed.couriers.filter(c=> mode==='replace' || !cById.has(c.id) || isUntouchedDefault(cById.get(c.id)));
  if(mode==='merge'){
    // every courier keeps a distinct place in the order
    const taken = new Set(couriers.filter(c=>!addC.some(a=>a.id===c.id)).map(c=>c.order));
    let nextOrder = Math.max(0, ...[...taken].filter(Number.isFinite));
    addC.forEach(c=>{ if(taken.has(c.data.order) || !Number.isFinite(c.data.order)) c.data.order = ++nextOrder; taken.add(c.data.order); nextOrder = Math.max(nextOrder, c.data.order); });
  }
  const addT = parsed.transactions.filter(t=> mode==='replace' || !txById.has(t.id));
  const plan = mode==='merge' ? planMerge(parsed) : {fills:[], differ:[], renumber:[]};
  const renumberSet = new Set(plan.renumber);
  if(info.mode==='claude'){
    const finalCount = mode==='replace' ? parsed.couriers.length + parsed.transactions.length + 1 : couriers.length + transactions.length + 1 + addC.length + addT.length;
    if(finalCount > ONLINE_DOC_LIMIT - 20){ toast(`Za dużo danych dla bazy online (${num(finalCount)} z ${num(ONLINE_DOC_LIMIT)} wpisów). Użyj wersji lokalnej.`, true); return; }
  }
  const writes = [];
  if(mode==='replace'){
    const keepT = new Set(parsed.transactions.map(t=>t.id)), keepC = new Set(parsed.couriers.map(c=>c.id));
    [...transactions, ...invalidTx].forEach(t=>{ if(!keepT.has(t.id)) writes.push({op:'delete', coll:'transactions', id:t.id}); });
    couriers.forEach(c=>{ if(!keepC.has(c.id)) writes.push({op:'delete', coll:'couriers', id:c.id}); });
  }
  importRunning = true; bulkWriting = true;
  openModal(`<h2>Wczytywanie kopii…</h2><div class="modal-sub" id="importProgress">Przygotowanie…</div><div class="meter"><span id="importBar" style="width:0%"></span></div>`);
  modalCancelHook = ()=>{}; // can't be dismissed while writing
  // Document numbers first, in one locked step: the counter is read once and moved once — never below
  // the stored one, the file's, or any number already in use here or in the file — and operations from
  // the file whose number is taken here get the next numbers, saved together with them below.
  const newNr = new Map();
  const addIds = new Set(addT.map(t=>t.id));
  // highest numbers of operations held here before waiting for the numbering lease (not the counter: a number
  // handed out elsewhere whose operation has not arrived yet must count as taken)
  const seenTop = {wydanie:0, zwrot:0};
  { const map = buildDocketMap(); transactions.forEach(t=>{ const n = saneNum(docketNum(map[t.id])); if(n > (seenTop[t.typ]||0)) seenTop[t.typ] = n; }); }
  const skipIds = new Set();   // file operations that turned out to be in the database already (merge adds only what is missing)
  const recheck = [];          // kept file numbers that another device may have handed out a moment ago — checked again after saving
  let reserved = null;
  try{
    await withNumberingLock(async ()=>{
      const cur = await readCounters();
      if(mode==='merge'){
        // while this step waited for the lease, another device may have saved operations: check the file's
        // numbers against the local copy again, and treat numbers handed out meanwhile (not saved here yet)
        // as taken; operations from old copies without a number get theirs here as well, in date order
        const here = new Set(transactions.map(t=>t.id));
        addIds.forEach(id=>{ if(here.has(id)) skipIds.add(id); });   // arrived meanwhile (e.g. the same file on another device)
        planMerge(parsed).renumber.forEach(id=>renumberSet.add(id));
        const between = [];
        parsed.transactions.forEach(t=>{
          if(!addIds.has(t.id) || skipIds.has(t.id)) return;
          if(!hasValidNr(t.data)){ renumberSet.add(t.id); return; }
          const n = docketNum(t.data.nr), k = t.data.typ==='wydanie' ? 'wz' : 'pz';
          if(n > (seenTop[t.data.typ]||0) && n <= saneNum(cur.data[k]||0) && !renumberSet.has(t.id)) between.push(t);
        });
        // a number above those held here but within the counter: handed out on another device (its operation
        // may still be on the way) or freed by a deletion (an operation brought back from a copy keeps it).
        // It is taken only if another operation in the database has it; a number handed out a moment ago whose
        // operation isn't saved yet is caught by that device's own duplicate check after saving.
        if(between.length > 50) between.forEach(t=>renumberSet.add(t.id));
        else for(let i=0; i<between.length; i+=5){
          const res = await Promise.all(between.slice(i, i+5).map(t=>db.collection('transactions').where('nr','==',t.data.nr).get()
            .then(sn=>sn.docs.some(d=>d.id!==t.id), ()=>true)));
          res.forEach((taken, j)=>{ if(taken) renumberSet.add(between[i+j].id); else recheck.push(between[i+j]); });
        }
        // the local copy can lag behind the database: an operation that is already stored there under the
        // same id is the same operation — it is left as it is, not given a new number
        const fileById = new Map(parsed.transactions.map(t=>[t.id, t]));
        const ask = [...renumberSet].filter(id=>addIds.has(id) && !skipIds.has(id) && fileById.has(id) && hasValidNr(fileById.get(id).data));
        if(ask.length && ask.length <= 50){
          for(let i=0; i<ask.length; i+=5){
            const got = await Promise.all(ask.slice(i, i+5).map(id=>db.collection('transactions').doc(id).get().then(sn=>sn.exists ? id : null, ()=>null)));
            got.forEach(id=>{ if(id){ skipIds.add(id); renumberSet.delete(id); } });
          }
        }
        skipIds.forEach(id=>renumberSet.delete(id));
      }
      const top = {
        wydanie: Math.max(saneNum(cur.data.wz||0), saneNum((counters&&counters.wz)||0), saneNum(Number(parsed.counters.wz)||0)),
        zwrot: Math.max(saneNum(cur.data.pz||0), saneNum((counters&&counters.pz)||0), saneNum(Number(parsed.counters.pz)||0)),
      };
      const bump = (typ, n)=>{ n = saneNum(n); if(n > (top[typ]||0)) top[typ] = n; };
      parsed.transactions.forEach(t=>{ if(!renumberSet.has(t.id) && hasValidNr(t.data)) bump(t.data.typ, docketNum(t.data.nr)); });
      if(mode==='merge'){ const map = buildDocketMap(); transactions.forEach(t=> bump(t.typ, docketNum(map[t.id]))); }
      parsed.transactions.filter(t=>renumberSet.has(t.id) && !skipIds.has(t.id)).sort((a,b)=>(a.data.createdAt||0)-(b.data.createdAt||0))
        .forEach(t=>{ top[t.data.typ] += 1; newNr.set(t.id, padNr(t.data.typ, top[t.data.typ])); });
      const target = {wz: top.wydanie, pz: top.zwrot};
      if(!cur.exists || cur.data.wz!==target.wz || cur.data.pz!==target.pz){
        await writeCounters(cur, target);
        if(newNr.size) reserved = {before:{wz:cur.data.wz||0, pz:cur.data.pz||0}, target};
      }
    });
  }catch(e){
    console.error(e); importRunning = false; bulkWriting = movingOps;
    if(document.getElementById('importProgress')) closeModal();
    mergeTransactions(); render(true); migrateDockets();   // live updates that arrived while waiting were held back
    toast(e && e.code==='busy' ? 'Numeracja dokumentów jest zajęta na innym urządzeniu — nic nie zapisano, spróbuj ponownie.' : 'Nie udało się przygotować numerów dokumentów — nic nie zapisano. Spróbuj ponownie.', true);
    return;
  }
  const logoMap = {};
  for(const c of addC){
    const lid = c.data.logoAssetId; const du = lid && parsed.logos[lid];
    if(du && assetsApi && typeof du==='string' && du.startsWith('data:image/')){
      try{ const res = await assetsApi.upload(dataUrlToBlob(du)); logoMap[lid] = res.id; }catch(e){ console.warn('logo', e); }
    }
  }
  addC.forEach(c=>{ const d = {...c.data}; if(d.logoAssetId){ if(logoMap[d.logoAssetId]) d.logoAssetId = logoMap[d.logoAssetId]; else if(!(mode==='replace' && cById.get(c.id) && cById.get(c.id).logoAssetId===d.logoAssetId)) delete d.logoAssetId; } writes.push({op:'set', coll:'couriers', id:c.id, data:d}); });
  // merge: fill what existing couriers lack (opening balance, logo)
  for(const f of plan.fills){
    const patch = {...f.patch};
    if(patch.logoAssetId){
      const du = parsed.logos[patch.logoAssetId]; delete patch.logoAssetId;
      if(du && assetsApi && typeof du==='string' && du.startsWith('data:image/')){
        try{ const res = await assetsApi.upload(dataUrlToBlob(du)); patch.logoAssetId = res.id; patch.noLogo = false; }catch(e){ console.warn('logo', e); }
      }
    }
    if(Object.keys(patch).length) writes.push({op:'update', coll:'couriers', id:f.id, data:patch});
  }
  // a number already used here by another operation is replaced by the one reserved above
  const nrAt = Date.now();
  const addList = addT.filter(t=>!skipIds.has(t.id));
  addList.forEach(t=>{ const d = {...t.data}; if(newNr.has(t.id)){ d.nr = newNr.get(t.id); d.nrAt = nrAt; } writes.push({op:'set', coll:'transactions', id:t.id, data:d}); });
  let done = 0, failed = 0; const queue = writes.slice();
  const progress = ()=>{ const el = document.getElementById('importProgress'), bar = document.getElementById('importBar'); if(el) el.textContent = `Zapisano ${num(done)} z ${num(writes.length)}…`; if(bar) bar.style.width = (writes.length ? done/writes.length*100 : 100).toFixed(1)+'%'; };
  const worker = async ()=>{
    while(queue.length){
      const w = queue.shift();
      try{ const ref = db.collection(w.coll).doc(w.id); if(w.op==='delete') await ref.delete(); else if(w.op==='update') await ref.update(w.data); else await ref.set(w.data); }
      catch(e){ failed++; console.error('import', w, e); }
      done++; if(done%5===0 || done===writes.length) progress();
    }
  };
  if(typeof db.batch==='function'){
    // one durable transaction per 400 writes instead of one per document (much faster, atomic per chunk)
    while(queue.length){
      const chunk = queue.splice(0, 400);
      try{
        const b = db.batch();
        chunk.forEach(w=>{ const ref = db.collection(w.coll).doc(w.id); if(w.op==='delete') b.delete(ref); else if(w.op==='update') b.update(ref, w.data); else b.set(ref, w.data); });
        await b.commit();
      }catch(e){ failed += chunk.length; console.error('import batch', e); }
      done += chunk.length; progress();
    }
  } else {
    await Promise.all(Array.from({length: Math.min(6, Math.max(1, writes.length))}, worker));
  }
  // a kept number that meanwhile turned up on another operation (saved on another device): this one takes a new number
  let lateRenumbered = 0;
  for(const t of recheck){
    try{
      const sn = await db.collection('transactions').where('nr','==',t.data.nr).get();
      if(sn.docs.some(d=>d.id!==t.id) && sn.docs.some(d=>d.id===t.id)){
        const fresh = await allocDocket(t.data.typ);
        await db.collection('transactions').doc(t.id).update({nr:fresh, nrAt:Date.now()});
        lateRenumbered++;
      }
    }catch(e){ console.warn('recheck', t.id, e); }
  }
  let settingsFailed = false;
  try{
    if(!(settings && settings.seeded)){ await db.doc('meta/settings').set({...(settings||{}), seeded:true}); }
  }catch(e){ settingsFailed = true; console.error(e); }
  // nothing was written: give the reserved numbers back (unless someone has taken a later one meanwhile)
  if(reserved && writes.length && failed >= writes.length){
    try{ await withNumberingLock(async ()=>{ const cur = await readCounters(); if(cur.data.wz===reserved.target.wz && cur.data.pz===reserved.target.pz) await writeCounters(cur, reserved.before); }); }
    catch(e){ console.warn('release', e); }
  }
  const renumbered = failed ? 0 : newNr.size + lateRenumbered;
  couriersSeeded = true; docketMigrationDone = false;
  // imported operations older than the live window are not delivered by the subscription — reload that part
  olderTx.clear(); olderBoundary = null;
  if(liveTx.length >= TX_WINDOW){ olderBoundary = liveTx[liveTx.length-1].data; historyComplete = false; await loadOlderTransactions(olderBoundary); }
  else historyComplete = true;
  // the live update of the imported data can restart that load (new boundary) — wait for it, so the
  // totals are already complete when the import reports success
  for(let i=0; i<150 && !historyComplete; i++) await new Promise(r=>setTimeout(r, 100));
  importRunning = false; bulkWriting = movingOps;
  // only this import's own window is closed; the operation form keeps what was typed into it
  if(document.getElementById('importProgress')) closeModal();
  mergeTransactions(); render(true);
  // numbers for operations saved without one (old copies) are given from a local copy that already
  // holds every imported operation — otherwise the next live update does it (a stale copy could hand
  // out a number an imported operation already has)
  { const have = new Set(transactions.map(t=>t.id)); const gone = writes.filter(w=>w.op==='delete' && w.coll==='transactions').map(w=>w.id);
    if(addList.every(t=>have.has(t.id)) && !gone.some(id=>have.has(id))) migrateDockets(); }
  if(failed) toast(`Wczytano z błędami: nie zapisano ${num(failed)} z ${num(writes.length)} wpisów. Spróbuj ponownie (tryb „Połącz” uzupełni braki).`, true);
  else if(settingsFailed) toast('Wczytano kopię, ale nie udało się zapisać ustawień — odśwież stronę i sprawdź listę kurierów.', true);
  else toast(`Wczytano kopię: kurierzy ${num(addC.length)}, ${opsLabel(addList.length)}${mode==='replace' && writes.some(w=>w.op==='delete') ? `, usunięto ${num(writes.filter(w=>w.op==='delete').length)}` : ''}${plan.fills.length ? `, uzupełniono dane kurierów: ${num(plan.fills.length)}` : ''}${renumbered ? `, nowe numery dokumentów: ${num(renumbered)}` : ''}${plan.differ.length ? `; tutejsze ustawienia zachowane u: ${plan.differ.map(d=>d.name).join(', ')}` : ''}.`);
}

async function handleIssueAction(btn){
  const act = btn.dataset.issueAct, id = btn.dataset.id;
  if(act==='edit'){ editingId = id; currentView = 'new'; render(); window.scrollTo(0,0); }
  else if(act==='courier'){ openCourierDetail(id); }
  else if(act==='delete'){
    const t = transactions.find(x=>x.id===id); if(!t) return;
    confirmModal('Usunąć operację?', `${escapeHtml(buildDocketMap()[t.id]||'')} — ${escapeHtml(txCourierName(t))}, ${palet(t.ilosc)}, ${fmtDate(t.data)}.`, ()=>deleteTransaction(id));
  }
  else if(act==='delete-raw'){
    confirmModal('Usunąć uszkodzony wpis?', 'Wpis nie jest liczony w bilansach. Usunięcia nie można cofnąć.', async ()=>{ try{ await db.collection('transactions').doc(id).delete(); olderTx.delete(id); mergeTransactions(); render(); noteLocalWrite(); toast('Usunięto uszkodzony wpis'); }catch(e){ toast('Nie udało się usunąć wpisu', true); } });
  }
  else if(act==='renumber'){
    btn.disabled = true;
    try{
      for(const tid of (btn.dataset.ids||'').split(',').filter(Boolean)){
        const t = transactions.find(x=>x.id===tid); if(!t) continue;
        const nr = await allocDocket(t.typ);
        await db.collection('transactions').doc(tid).update({nr, nrAt: Date.now()});
        if(olderTx.has(tid)) olderTx.set(tid, {...olderTx.get(tid), nr});
      }
      mergeTransactions(); render(); toast('Nadano nowe numery dokumentów');
    }catch(e){ console.error(e); toast('Nie udało się nadać numerów', true); btn.disabled = false; }
  }
  else if(act==='restore-courier'){
    if(!historyComplete){ toast('Trwa wczytywanie historii — spróbuj za chwilę', true); return; }
    if(movingOps || importRunning) return;
    const name = String(btn.dataset.name||id).trim().replace(/\s+/g,' ').slice(0,60);
    // a courier with this name was added again meanwhile: a second one with the same name would split
    // the history between two identical cards — move the operations to the existing one instead
    const same = couriers.find(c=>(c.name||'').trim().toLowerCase()===name.toLowerCase());
    if(same){
      const ops = transactions.filter(t=>t.kurierId===id);
      const ok = await confirmDialog('Kurier o tej nazwie już jest', `Na liście jest już kurier „${escapeHtml(same.name)}”. Przenieść do niego ${opsAcc(ops.length)} usuniętego kuriera „${escapeHtml(name)}”? Jego bilans i rozliczenia obejmą wtedy także te operacje.`, {okLabel:'Przenieś operacje', danger:false});
      if(!ok) return;
      await moveOperations(ops, same);
      return;
    }
    try{ await restoreCourier(id, name); toast(`Przywrócono kuriera „${name}”`); }
    catch(e){ console.error(e); toast('Nie udało się przywrócić kuriera', true); }
  }
  else if(act==='twin-ok'){
    btn.disabled = true;
    try{
      await db.collection('transactions').doc(id).update({twinOk:true});
      const t = transactions.find(x=>x.id===id); if(t) applyLocalTx(id, {...t, twinOk:true});
      render(); noteLocalWrite();
      toast('Oznaczono jako osobną operację');
    }catch(e){ console.error(e); toast('Nie udało się zapisać zmiany', true); btn.disabled = false; }
  }
}
// courier record for an id that still has operations (a deleted courier brought back with its history)
async function restoreCourier(id, name, color){
  const order = (couriers.length? Math.max(...couriers.map(c=>c.order||0)) : 0) + 1;
  await db.collection('couriers').doc(id).set({name:String(name).slice(0,60), order, color: color || COURIER_COLORS[couriers.length % COURIER_COLORS.length], custom:true, enabled:true});
}
// operations of a deleted courier moved to an existing one (one move at a time, with progress)
let movingOps = false;
async function moveOperations(ops, target){
  if(movingOps) return;
  movingOps = true; bulkWriting = true;
  openModal(`<h2>Przenoszenie operacji…</h2><div class="modal-sub" id="moveProgress">Przygotowanie…</div><div class="meter"><span id="moveBar" style="width:0%"></span></div>`);
  modalCancelHook = ()=>{};   // can't be dismissed while writing
  const patch = {kurierId:target.id, kurierNazwa:target.name};
  let moved = 0, failed = 0, done = 0;
  const progress = ()=>{ const el = document.getElementById('moveProgress'), bar = document.getElementById('moveBar'); if(el) el.textContent = `Przeniesiono ${num(done)} z ${num(ops.length)}…`; if(bar) bar.style.width = (ops.length ? done/ops.length*100 : 100).toFixed(1)+'%'; };
  const local = (list)=>{ list.forEach(t=>applyLocalTx(t.id, {...t, ...patch})); };
  // no connection (or the password refused): the rest is not attempted — it would only wait for timeouts
  const offline = (e)=> !!(e && (e.network || e.auth || e.code==='unavailable'));
  let stopped = false;
  const one = async (t)=>{
    if(stopped){ failed++; done++; return; }
    try{ await db.collection('transactions').doc(t.id).update(patch); local([t]); moved++; }
    catch(e){ failed++; console.error('move', t.id, e); if(offline(e)) stopped = true; }
    done++;
  };
  try{
    if(typeof db.batch==='function'){
      for(let i=0; i<ops.length; i+=400){
        const chunk = ops.slice(i, i+400);
        if(stopped){ failed += chunk.length; done += chunk.length; continue; }
        try{ const b = db.batch(); chunk.forEach(t=>b.update(db.collection('transactions').doc(t.id), patch)); await b.commit(); local(chunk); moved += chunk.length; done += chunk.length; }
        catch(e){
          console.warn('move batch', e);
          if(offline(e)){ stopped = true; failed += chunk.length; done += chunk.length; }
          else for(const t of chunk){ await one(t); if(done%5===0) progress(); }   // e.g. one of them deleted elsewhere: the rest still moves
        }
        noteLocalWrite(); progress();
      }
    } else {
      for(const t of ops){ await one(t); if(done%5===0 || done===ops.length) progress(); if(done%50===0) noteLocalWrite(); }
      noteLocalWrite();
    }
  } finally {
    movingOps = false; bulkWriting = importRunning;
    if(document.getElementById('moveProgress')) closeModal();
    mergeTransactions(); render(true);
  }
  if(failed) toast(`Przeniesiono ${opsAcc(moved)}, nie udało się przenieść ${num(failed)} — spróbuj ponownie.`, true);
  else toast(`Przeniesiono ${opsAcc(moved)} do kuriera „${target.name}”`);
}

function exportStatementCsv(id){
  if(stFrom && stTo && stFrom > stTo){ toast('Popraw okres — data „od” jest późniejsza niż „do”', true); return; }
  const c = courierById(id) || {name:(transactions.find(t=>t.kurierId===id)||{}).kurierNazwa || id};
  const st = courierStatement(id, stFrom, stTo); const map = buildDocketMap();
  const L = [];
  L.push([csvCell('Zestawienie rozliczeniowe palet'), csvCell(c.name, true)].join(';'));
  L.push([csvCell('Okres'), csvCell(`${stFrom? fmtDate(stFrom) : 'początek ewidencji'} – ${fmtDate(stTo||todayStr())}`)].join(';'));
  L.push([csvCell(stFrom? `Saldo na ${fmtDate(addDays(stFrom,-1))}` : 'Stan początkowy'), csvCell(st.startBal)].join(';'));
  L.push('');
  L.push(['Data','Dokument','Operacja','Wydane','Zwrócone','Saldo po operacji','Uwagi'].map(x=>csvCell(x)).join(';'));
  st.rows.forEach(r=> L.push([csvCell(r.t.data), csvCell(map[r.t.id]||''), csvCell(r.t.typ==='wydanie'?'wydanie':'zwrot'), csvCell(r.t.typ==='wydanie'? r.t.ilosc : ''), csvCell(r.t.typ==='zwrot'? r.t.ilosc : ''), csvCell(r.bal), csvCell(r.t.uwagi||'', true)].join(';')));
  L.push('');
  L.push([csvCell('Razem wydane'), csvCell(st.w)].join(';'));
  L.push([csvCell('Razem zwrócone'), csvCell(st.z)].join(';'));
  L.push([csvCell(`Saldo na ${fmtDate(stTo||todayStr())}`), csvCell(st.endBal)].join(';'));
  saveFile(`rozliczenie-${slugify(c.name)}-${stFrom||'start'}-${stTo||todayStr()}.csv`, '﻿'+L.join('\r\n'), 'text/csv;charset=utf-8');
}

/* ---------------------------- MODALS ---------------------------- */
let modalCancelHook = null; // set by confirmModal so Escape / overlay click resolve its promise as "cancel"
let modalOpener = null, printOpener = null;
const FOCUSABLE = 'button:not([disabled]), [href], input:not([disabled]):not(.visually-hidden), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';
// while a dialog is open, the page behind it can't be reached with Tab
function setBackgroundInert(on){ ['.app', '#bottomNav'].forEach(sel=>{ const el = document.querySelector(sel); if(el){ if(on) el.setAttribute('inert',''); else el.removeAttribute('inert'); } }); }
function trapTab(container, e){
  if(e.key!=='Tab') return;
  const items = [...container.querySelectorAll(FOCUSABLE)].filter(el=>el.offsetParent!==null || el===document.activeElement);
  if(!items.length) return;
  const first = items[0], last = items[items.length-1];
  if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
}
function openModal(html){
  modalCancelHook = null;
  if(!document.getElementById('modalRoot').innerHTML) modalOpener = describeEl(document.activeElement);
  document.getElementById('modalRoot').innerHTML = `<div class="modal-overlay" id="modalOverlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">${html}</div></div>`;
  const modal = document.querySelector('#modalRoot .modal');
  const h = modal.querySelector('h2'); if(h) h.id = 'modalTitle';
  setBackgroundInert(true);
  document.getElementById('modalOverlay').addEventListener('click', (e)=>{ if(e.target.id==='modalOverlay') dismissModal(); });
  modal.addEventListener('keydown', (e)=>trapTab(modal, e));
  setTimeout(()=>{ if(!modal.isConnected || modal.contains(document.activeElement)) return; const f = modal.querySelector('input:not([type=hidden]):not(.visually-hidden):not([type=radio]), select, textarea') || modal.querySelector(FOCUSABLE); if(f) f.focus(); }, 0);
}
function closeModal(){
  modalCancelHook = null; document.getElementById('modalRoot').innerHTML='';
  if(!document.getElementById('printRoot').innerHTML) setBackgroundInert(false);
  const back = modalOpener; modalOpener = null;
  restoreFocus(back);
}
// remember an element so focus can return to it even after a re-render replaced it
function describeEl(el){ if(!el || el===document.body) return null; return {el, id:el.id||'', action:el.dataset ? el.dataset.action||'' : '', dataId:el.dataset ? el.dataset.id||'' : ''}; }
function restoreFocus(d){
  let t = null;
  if(d){
    if(d.el && d.el.isConnected) t = d.el;
    else if(d.id) t = document.getElementById(d.id);
    if(!t && d.action){ t = [...document.querySelectorAll(`[data-action="${CSS.escape(d.action)}"]`)].find(x=>!d.dataId || x.dataset.id===d.dataId) || null; }
  }
  if(t && typeof t.focus==='function' && t.offsetParent!==null){ t.focus({preventScroll:true}); return; }
  focusHeading();
}
// progress windows (import, moving operations) can't be dismissed while they run
function dismissModal(){ if(importRunning || movingOps) return; const h = modalCancelHook; if(h){ modalCancelHook = null; h(); } else closeModal(); }
document.addEventListener('keydown', (e)=>{
  if(e.key!=='Escape') return;
  if(document.getElementById('printRoot').innerHTML){ closePrint(); return; }
  if(document.getElementById('modalRoot').innerHTML) dismissModal();
});

function bindSwatches(groupId, onSelect){
  const items = [...document.querySelectorAll(`#${groupId} .swatch`)];
  const pick = (sw, focus)=>{ items.forEach(s=>{ const on = s===sw; s.classList.toggle('sel', on); s.setAttribute('aria-checked', String(on)); s.tabIndex = on ? 0 : -1; }); if(focus) sw.focus(); onSelect(sw.dataset.color); };
  items.forEach((sw,i)=>{
    sw.addEventListener('click', ()=>pick(sw, false));
    sw.addEventListener('keydown', (e)=>{
      const d = (e.key==='ArrowRight' || e.key==='ArrowDown') ? 1 : (e.key==='ArrowLeft' || e.key==='ArrowUp') ? -1 : 0;
      if(d){ e.preventDefault(); pick(items[(i+d+items.length)%items.length], true); }
    });
  });
}

// msg is trusted HTML built by the caller (user text inside it must already be escaped)
function confirmModal(title, msg, onConfirm, opts){
  opts = opts || {};
  openModal(`
    <h2>${escapeHtml(title)}</h2><div class="modal-sub">${msg}</div>
    <div class="modal-close-row"><button type="button" class="btn" data-action="close-modal">${escapeHtml(opts.cancelLabel||'Anuluj')}</button><button type="button" class="btn ${opts.danger===false?'btn-primary':'btn-danger'}" id="confirmBtn">${escapeHtml(opts.okLabel||'Usuń')}</button></div>
  `);
  let done = false;
  // ok: true = confirm button, false = cancel button, null = Esc / click outside (opts.onDismiss when given)
  const finish = (ok)=>{ if(done) return; done = true; closeModal(); if(ok===true) onConfirm(); else if(ok===null && opts.onDismiss) opts.onDismiss(); else if(opts.onCancel) opts.onCancel(); };
  document.querySelector('#modalRoot [data-action="close-modal"]').addEventListener('click', ()=>finish(false));
  document.getElementById('confirmBtn').addEventListener('click', ()=>finish(true));
  modalCancelHook = ()=>finish(null);
  setTimeout(()=>{ const b = document.getElementById('confirmBtn'); if(b) b.focus(); }, 1);
}
// resolves true / false; with opts.threeWay, Esc or a click outside resolves null ("back out")
function confirmDialog(title, msg, opts){
  opts = opts || {};
  return new Promise(resolve=> confirmModal(title, msg, ()=>resolve(true), {...opts, onCancel:()=>resolve(false), onDismiss: opts.threeWay ? ()=>resolve(null) : undefined}));
}
// a deleted courier (operations left, courier gone) whose operations carry this name: {id, n, bal} or null
function findOrphanByName(name){
  const key = String(name).trim().toLowerCase(), hits = {};
  transactions.forEach(t=>{ if(!courierById(t.kurierId) && (t.kurierNazwa||'').trim().toLowerCase()===key) hits[t.kurierId] = (hits[t.kurierId]||0) + 1; });
  const id = Object.keys(hits).sort((a,b)=>hits[b]-hits[a])[0];
  if(!id) return null;
  // the numbers shown are those of everything that comes back (the courier may have been renamed before deletion)
  const ops = transactions.filter(t=>t.kurierId===id);
  return {id, n: ops.length, bal: ops.reduce((s,t)=> s + (t.typ==='wydanie' ? t.ilosc : -t.ilosc), 0)};
}
function askRestore(name, o){
  return confirmDialog('Ten kurier był już w ewidencji', `Kurier „${escapeHtml(name)}” został wcześniej usunięty, a w historii ${plForm(o.n,'została','zostały','zostało')} ${opsLabel(o.n)} (bilans ${o.bal>0?'+':''}${num(o.bal)}). Przywrócić go razem z tą historią? „Dodaj nowego” utworzy osobnego kuriera bez tych operacji.`, {okLabel:'Przywróć z historią', cancelLabel:'Dodaj nowego', danger:false, threeWay:true});
}

async function createCourier(name, color){
  if(!historyComplete){ toast('Trwa wczytywanie historii — spróbuj za chwilę', true); return; }
  name = String(name).trim().replace(/\s+/g,' ').slice(0,60);
  const same = couriers.find(c=>(c.name||'').trim().toLowerCase()===name.toLowerCase());
  if(same){ toast(`Kurier „${same.name}” już jest na liście`, true); return; }
  const o = findOrphanByName(name);
  if(o){
    const back = await askRestore(name, o);
