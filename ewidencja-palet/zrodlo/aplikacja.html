<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Ewidencja Palet — Panel Administratora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    box-sizing:border-box;
    --bg:#F4F6F8; --panel:#FFFFFF; --panel-2:#F0F2F5; --border:#DDE2E7;
    --text:#12161B; --text-dim:#5B6670; --text-faint:#5F6A74;
    --accent:#0891A8; --accent-strong:#046B7F; --accent-bg:#DFF4F8;
    --good:#17734A; --good-bg:#E1F5EA;
    --bad:#A84A06; --bad-bg:#FBE6D2;
    --info:#5B4FE0; --info-bg:#EAE7FC;
    --glow-1: rgba(8,145,168,0.08); --glow-2: rgba(214,36,122,0.06);
    --shadow: 0 1px 2px rgba(15,20,25,.05), 0 8px 20px rgba(15,20,25,.06);
    --blur: blur(0px);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#080B0E; --panel:rgba(16,21,26,.78); --panel-2:rgba(20,26,32,.72); --border:#212930;
      --text:#E8F1F5; --text-dim:#8FA1AB; --text-faint:#7D8F99;
      --accent:#2BE8FF; --accent-strong:#7BF4FF; --accent-bg:rgba(43,232,255,0.12);
      --good:#39FF8A; --good-bg:rgba(57,255,138,0.10);
      --bad:#FF9F40; --bad-bg:rgba(255,159,64,0.12);
      --info:#9C8CFF; --info-bg:rgba(156,140,255,0.10);
      --glow-1: rgba(43,232,255,0.18); --glow-2: rgba(255,79,163,0.14);
      --shadow: 0 1px 2px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.03);
      --blur: blur(18px);
    }
  }
  :root[data-theme="dark"]{
    --bg:#080B0E; --panel:rgba(16,21,26,.78); --panel-2:rgba(20,26,32,.72); --border:#212930;
    --text:#E8F1F5; --text-dim:#8FA1AB; --text-faint:#7D8F99;
    --accent:#2BE8FF; --accent-strong:#7BF4FF; --accent-bg:rgba(43,232,255,0.12);
    --good:#39FF8A; --good-bg:rgba(57,255,138,0.10);
    --bad:#FF9F40; --bad-bg:rgba(255,159,64,0.12);
    --info:#9C8CFF; --info-bg:rgba(156,140,255,0.10);
    --glow-1: rgba(43,232,255,0.18); --glow-2: rgba(255,79,163,0.14);
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.03);
    --blur: blur(18px);
  }
  html{scroll-padding-top: env(safe-area-inset-top, 0px);}
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Space Grotesk', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased; min-height:100%; position:relative; overflow-x:hidden;
  }
  body::before, body::after{
    content:""; position:fixed; width:56vw; height:56vw; max-width:600px; max-height:600px;
    border-radius:50%; filter:blur(90px); pointer-events:none; z-index:0;
  }
  body::before{ top:-16%; left:-12%; background:var(--glow-1); }
  body::after{ bottom:-18%; right:-12%; background:var(--glow-2); }
  .mono{ font-family:'IBM Plex Mono', ui-monospace, monospace; }
  button{ font-family:inherit; }
  ::selection{ background:var(--accent); color:#04141A; }
  a{ color:var(--accent); }

  /* ---------- layout ---------- */
  .app{ display:flex; min-height:100vh; position:relative; z-index:1; }
  .sidebar{
    width:236px; flex-shrink:0; background:var(--panel); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
    border-right:1px solid var(--border);
    display:flex; flex-direction:column; padding:20px 14px; gap:22px;
  }
  .brand{ display:flex; align-items:center; gap:10px; padding:0 6px; }
  .brand-mark{
    width:34px; height:34px; border-radius:8px; background:linear-gradient(135deg, var(--accent), var(--info));
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    color:#04141A; font-weight:700; font-family:'IBM Plex Mono',monospace; font-size:14px;
    box-shadow:0 0 0 1px var(--border), 0 0 18px -4px var(--accent);
  }
  .brand-text{ line-height:1.15; }
  .brand-text b{ display:block; font-size:14.5px; letter-spacing:.2px; }
  .brand-text span{ display:block; font-size:13px; color:var(--text-faint); }

  nav.nav{ display:flex; flex-direction:column; gap:2px; }
  .nav-item{
    display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:8px; border:none;
    background:transparent; color:var(--text-dim); font-size:14px; font-weight:500; text-align:left; cursor:pointer; width:100%;
  }
  .nav-item svg{ width:17px; height:17px; flex-shrink:0; }
  .nav-item:hover{ background:var(--panel-2); color:var(--text); }
  .nav-item.active{ background:var(--accent-bg); color:var(--accent-strong); box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent); }

  .sidebar-foot{ margin-top:auto; display:flex; flex-direction:column; gap:10px; }
  .balance-mini{
    border:1px solid color-mix(in srgb, var(--accent) 45%, var(--border)); border-radius:11px; padding:13px 14px;
    background:linear-gradient(135deg, var(--accent-bg), var(--panel-2));
    box-shadow:0 0 22px -10px var(--accent), inset 0 0 0 1px rgba(255,255,255,.02);
  }
  .balance-mini .lbl{ font-size:13px; text-transform:uppercase; letter-spacing:.5px; color:var(--text-faint); margin-bottom:4px;}
  .balance-mini .val{ font-family:'IBM Plex Mono',monospace; font-size:23px; font-weight:700; color:var(--accent-strong); text-shadow:0 0 18px var(--accent-bg); }
  .theme-toggle{
    display:flex; align-items:center; justify-content:center; gap:8px; border:1px solid var(--border);
    background:var(--panel-2); color:var(--text-dim); border-radius:8px; padding:9px; font-size:12.5px; cursor:pointer;
  }
  .theme-toggle:hover{ color:var(--text); }
  .theme-toggle svg{ width:14px; height:14px; }

  main{ flex:1; min-width:0; padding:26px 32px 60px; }

  /* mobile topbar + bottom nav (hidden on desktop) */
  .mobile-topbar{ display:none; }
  .bottom-nav{ display:none; }
  .fab-spacer{ display:none; }

  @media (max-width:860px){
    .app{ flex-direction:column; }
    .sidebar{ display:none; }
    .mobile-topbar{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      padding:12px 16px; padding-top:calc(12px + env(safe-area-inset-top,0px));
      background:var(--panel); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
      border-bottom:1px solid var(--border); position:sticky; top:0; z-index:20;
    }
    .mobile-topbar .brand{ padding:0; }
    .mobile-topbar .right{ display:flex; align-items:center; gap:8px; }
    .mobile-topbar .chip{
      font-family:'IBM Plex Mono',monospace; font-size:12.5px; font-weight:600; color:var(--accent-strong);
      background:var(--accent-bg); border-radius:99px; padding:6px 11px;
    }
    .mobile-topbar .icon-btn{ width:36px; height:36px; }
    main{ padding:16px 14px 24px; }
    .bottom-nav{
      display:flex; position:fixed; left:0; right:0; bottom:0; z-index:30;
      background:var(--panel); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
      border-top:1px solid var(--border);
      padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));
      justify-content:space-around; align-items:flex-end;
    }
    .bottom-nav .bn-item{
      display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none;
      color:var(--text-faint); font-size:13px; font-weight:600; padding:6px 8px; min-width:56px; cursor:pointer;
    }
    .bottom-nav .bn-item svg{ width:20px; height:20px; }
    .bottom-nav .bn-item.active{ color:var(--accent-strong); }
    .bottom-nav .bn-fab{
      position:relative; top:-16px; width:52px; height:52px; border-radius:50%;
      background:linear-gradient(135deg, var(--accent), var(--info)); color:#04141A;
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 0 0 4px var(--bg), 0 0 22px -2px var(--accent); border:none; cursor:pointer; flex-shrink:0;
      animation: fabPulse 2.6s ease-in-out infinite;
    }
    @keyframes fabPulse{
      0%,100%{ box-shadow:0 0 0 4px var(--bg), 0 0 18px -2px var(--accent); }
      50%{ box-shadow:0 0 0 4px var(--bg), 0 0 30px 2px var(--accent); }
    }
    .bottom-nav .bn-fab svg{ width:24px; height:24px; }
    .fab-spacer{ display:block; height:calc(74px + env(safe-area-inset-bottom,0px)); }
  }

  .view-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap; }
  .view-head h1{ font-size:21px; margin:0 0 4px; letter-spacing:-.2px; }
  .view-head p{ margin:0; color:var(--text-dim); font-size:13.5px; }
  .back-row{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .back-row button{ display:flex; align-items:center; gap:6px; background:none; border:none; color:var(--text-dim); font-size:13px; font-weight:600; cursor:pointer; padding:4px 0; }
  .back-row button svg{ width:15px; height:15px; }
  .back-row button:hover{ color:var(--accent-strong); }

  .btn{
    display:inline-flex; align-items:center; gap:7px; border-radius:9px; border:1px solid var(--border);
    background:var(--panel-2); color:var(--text); font-size:13.5px; font-weight:600;
    padding:10px 15px; cursor:pointer; white-space:nowrap;
  }
  .btn svg{ width:15px; height:15px; }
  .btn:hover{ border-color:var(--text-faint); }
  .btn-primary{ background:linear-gradient(135deg, var(--accent), var(--info)); border-color:transparent; color:#04141A; box-shadow:0 0 20px -6px var(--accent); }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-danger{ color:var(--bad); }
  .btn-danger:hover{ border-color:var(--bad); }
  .btn-ghost{ border-color:transparent; background:transparent; }
  .btn-ghost:hover{ background:var(--panel-2); border-color:transparent; }
  .btn-sm{ padding:7px 11px; font-size:12.5px; }
  .btn:disabled, .btn[aria-disabled="true"]{ opacity:.5; cursor:not-allowed; }
  .btn-block{ width:100%; justify-content:center; }

  /* ---------- cards / grid ---------- */
  .grid{ display:grid; gap:14px; }
  .kpi-grid{ grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); }
  .kpi{ background:var(--panel); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur); border:1px solid var(--border); border-radius:12px; padding:14px 16px; box-shadow:var(--shadow); }
  .kpi .lbl{ font-size:12.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--text-faint); margin-bottom:7px; }
  .kpi .val{ font-family:'IBM Plex Mono',monospace; font-size:23px; font-weight:700; line-height:1.15; }
  .kpi .sub{ font-size:13px; color:var(--text-dim); margin-top:5px; }
  .kpi.clickable{ cursor:pointer; }
  .kpi.clickable:hover{ border-color:var(--accent); }

  .hero{
    background:var(--panel); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
    border:1px solid var(--border); border-radius:16px; padding:26px 26px 22px; margin-bottom:16px;
    box-shadow:var(--shadow); position:relative; overflow:hidden;
  }
  .hero .lbl{ font-size:13.5px; text-transform:uppercase; letter-spacing:.6px; color:var(--text-faint); margin-bottom:8px; }
  .hero .val{
    font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:52px; line-height:1;
    background:linear-gradient(135deg, var(--accent), var(--info));
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:var(--accent);
  }
  .hero .unit{ font-size:16px; color:var(--text-dim); margin-left:8px; -webkit-text-fill-color:var(--text-dim); }
  .hero .foot{ margin-top:12px; font-size:12.5px; color:var(--text-faint); }
  .hero .foot b{ color:var(--text-dim); font-weight:600; }

  .panel{ background:var(--panel); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); padding:18px 18px; margin-bottom:16px; }
  .panel-title{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  .panel-title h2{ font-size:16.5px; margin:0; padding-left:11px; position:relative; }
  .panel-title h2::before{ content:""; position:absolute; left:0; top:1px; bottom:1px; width:3px; border-radius:2px; background:linear-gradient(180deg, var(--accent), var(--info)); box-shadow:0 0 8px -1px var(--accent); }
  .panel-title .hint{ font-size:12.5px; color:var(--text-dim); }

  .courier-grid{ grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); }
  .courier-card{
    background:var(--panel); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
    border:1px solid var(--border); border-top:3px solid var(--c-color, var(--accent));
    border-radius:12px; padding:14px 15px; box-shadow:var(--shadow); cursor:pointer;
  }
  .courier-card:hover{ border-color:var(--c-color, var(--accent)); }
  .courier-card .head{ display:flex; align-items:center; gap:10px; margin-bottom:11px; }
  .courier-card .name{ font-weight:700; font-size:16.5px; line-height:1.25; }
  .courier-card .tag{ font-size:13.5px; font-family:'IBM Plex Mono',monospace; color:var(--text-faint); }
  .courier-card .row{ display:flex; justify-content:space-between; font-size:14px; color:var(--text-dim); padding:4px 0; }
  .courier-card .row b{ font-family:'IBM Plex Mono',monospace; color:var(--text); font-weight:600; }
  .courier-card .balance-line{ margin-top:8px; padding-top:8px; border-top:1px dashed var(--border); display:flex; justify-content:space-between; align-items:center; }
  .courier-card .balance-line .val{ font-family:'IBM Plex Mono',monospace; font-size:21px; font-weight:700; }
  .pill{ display:inline-flex; align-items:center; padding:2px 9px; border-radius:99px; font-size:13px; font-weight:600; }
  .pill-good{ background:var(--good-bg); color:var(--good); }
  .pill-bad{ background:var(--bad-bg); color:var(--bad); }
  .pill-neutral{ background:var(--panel-2); color:var(--text-dim); }

  .badge{ border-radius:8px; flex-shrink:0; object-fit:contain; }
  .badge-init{ display:flex; align-items:center; justify-content:center; color:#04141A; font-weight:700; font-family:'IBM Plex Mono',monospace; flex-shrink:0; }

  /* ---------- forms ---------- */
  .form-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:14px; max-width:640px; }
  @media (max-width:600px){ .form-grid{ grid-template-columns:1fr; } }
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field.span2{ grid-column:1 / -1; }
  .field label{ font-size:12.5px; font-weight:600; color:var(--text-dim); }
  .field .req{ color:var(--bad); }
  select, input[type=text], input[type=number], input[type=date], textarea{
    font-family:'Space Grotesk', sans-serif; font-size:15px; padding:11px 12px; border-radius:9px;
    border:1px solid var(--border); background:var(--panel-2); color:var(--text); width:100%;
  }
  input[type=number], input[type=date]{ font-family:'IBM Plex Mono', monospace; }
  select:focus, input:focus, textarea:focus, button:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  textarea{ resize:vertical; min-height:64px; }
  .type-toggle{ display:flex; gap:8px; }
  .type-toggle label{
    flex:1; display:flex; align-items:center; justify-content:center; gap:7px;
    border:1px solid var(--border); border-radius:9px; padding:13px 10px; cursor:pointer;
    font-size:14px; font-weight:600; color:var(--text-dim);
  }
  .type-toggle input{ display:none; }
  .type-toggle .opt-wydanie:has(input:checked){ background:var(--bad-bg); border-color:var(--bad); color:var(--bad); }
  .type-toggle .opt-zwrot:has(input:checked){ background:var(--good-bg); border-color:var(--good); color:var(--good); }
  .form-actions{ display:flex; gap:10px; margin-top:6px; grid-column:1/-1; }
  .form-note{ font-size:13.5px; color:var(--text-faint); margin-top:2px; }

  /* ---------- table ---------- */
  .table-wrap{ overflow-x:auto; border:1px solid var(--border); border-radius:12px; }
  table{ width:100%; border-collapse:collapse; font-size:13.5px; min-width:640px; }
  thead th{
    text-align:left; font-size:13px; text-transform:uppercase; letter-spacing:.4px;
    color:var(--text-faint); padding:10px 12px; background:var(--panel-2); border-bottom:1px solid var(--border);
    white-space:nowrap; position:sticky; top:0;
  }
  tbody td{ padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:middle; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:var(--panel-2); }
  tbody tr.clickable{ cursor:pointer; }
  td.num, th.num{ font-family:'IBM Plex Mono',monospace; text-align:right; }
  td.docket{ font-family:'IBM Plex Mono',monospace; font-size:13.5px; color:var(--text-faint); }
  .row-actions{ display:flex; gap:6px; justify-content:flex-end; }
  .icon-btn{
    border:1px solid transparent; background:transparent; color:var(--text-faint);
    width:30px; height:30px; border-radius:8px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .icon-btn svg{ width:15px; height:15px; flex-shrink:0; }
  .icon-btn:hover{ background:var(--panel-2); color:var(--text); }
  .icon-btn.danger:hover{ color:var(--bad); }
  .icon-btn.accent:hover{ color:var(--accent-strong); }

  /* responsive card-table for mobile: same markup, restyled below 640px */
  @media (max-width:640px){
    table.table-card{ min-width:0; }
    table.table-card thead{ display:none; }
    table.table-card, table.table-card tbody, table.table-card tr, table.table-card td{ display:block; width:100%; }
    table.table-card tbody tr{
      border:1px solid var(--border); border-radius:12px; margin-bottom:10px; padding:4px 13px;
      background:var(--panel-2);
    }
    table.table-card tbody tr:last-child{ margin-bottom:0; }
    table.table-card td{
      border:none; padding:7px 0; display:flex; justify-content:space-between; align-items:center; gap:10px; text-align:right;
    }
    table.table-card td::before{
      content:attr(data-label); font-size:13px; text-transform:uppercase; letter-spacing:.4px;
      color:var(--text-faint); text-align:left; font-weight:700; flex-shrink:0;
    }
    table.table-card td[data-label=""]::before{ content:none; }
    table.table-card td:empty{ display:none; }
    table.table-card td .row-actions{ justify-content:flex-end; width:100%; }
  }

  .filters{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:16px; align-items:flex-end; }
  .filters .field{ min-width:150px; }
  .filters .field.grow{ flex:1; min-width:180px; }
  .search-wrap input{ padding-left:34px; }
  .search-wrap{ position:relative; }
  .search-wrap svg{ position:absolute; left:11px; top:50%; transform:translateY(-50%); width:14px; height:14px; color:var(--text-faint); }

  .empty{ text-align:center; padding:44px 20px; color:var(--text-dim); }
  .empty svg{ width:32px; height:32px; color:var(--text-faint); margin-bottom:10px; }
  .empty h3{ margin:0 0 6px; font-size:14.5px; color:var(--text); }
  .empty p{ margin:0; font-size:13px; }

  .type-badge{ display:inline-flex; align-items:center; gap:5px; font-size:13.5px; font-weight:600; padding:3px 9px; border-radius:99px; }
  .type-badge.wydanie{ background:var(--bad-bg); color:var(--bad); }
  .type-badge.zwrot{ background:var(--good-bg); color:var(--good); }

  /* ---------- stats ---------- */
  .period-tabs{ display:flex; gap:3px; background:var(--panel-2); border:1px solid var(--border); border-radius:9px; padding:3px; width:fit-content; }
  .period-tabs button{ border:none; background:transparent; padding:8px 13px; border-radius:7px; font-size:12.5px; font-weight:600; color:var(--text-dim); cursor:pointer; }
  .period-tabs button.active{ background:var(--panel); color:var(--accent-strong); box-shadow:0 0 0 1px var(--border); }
  .stats-grid-2{ grid-template-columns:1.3fr 1fr; }
  .stats-grid-2.wide-right{ grid-template-columns:1fr 1.3fr; }
  /* two charts side by side only above 1200 px (charts are drawn at their panel's real width) */
  @media (max-width:1200px){ .stats-grid-2, .stats-grid-2.wide-right{ grid-template-columns:1fr; } }
  .chart-legend{ display:flex; gap:16px; margin-bottom:10px; flex-wrap:wrap; }
  .chart-legend .item{ display:flex; align-items:center; gap:6px; font-size:13.5px; color:var(--text-dim); }
  .chart-legend .dot{ width:9px; height:9px; border-radius:3px; }
  .records-grid{ grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); }
  .record-card{ padding:13px 15px; }
  .record-card .lbl{ font-size:13px; color:var(--text-faint); margin-bottom:5px; }
  .record-card .val{ font-family:'IBM Plex Mono',monospace; font-size:15.5px; font-weight:600; }
  .record-card .sub{ font-size:13.5px; color:var(--text-dim); margin-top:3px; }

  .week-nav{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
  .week-nav .label{ font-size:13.5px; font-weight:600; text-align:center; }
  .week-nav .label .badge-cur{ display:inline-block; margin-left:6px; font-size:12.5px; font-weight:700; background:var(--accent-bg); color:var(--accent-strong); padding:2px 7px; border-radius:99px; }
  .nav-arrow{ width:34px; height:34px; border-radius:9px; border:1px solid var(--border); background:var(--panel-2); color:var(--text-dim); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
  .nav-arrow:hover{ color:var(--accent-strong); border-color:var(--accent); }
  .nav-arrow svg{ width:16px; height:16px; }

  .acc-item{ border:1px solid var(--border); border-radius:10px; margin-bottom:8px; overflow:hidden; }

  .acc-head:hover{ background:var(--panel-2); }
  .acc-head .name{ font-weight:600; font-size:13.5px; display:flex; align-items:center; gap:8px; }
  .acc-head .stats{ display:flex; gap:14px; font-family:'IBM Plex Mono',monospace; font-size:12.5px; }
  .acc-head .stats .w{ color:var(--bad); } .acc-head .stats .z{ color:var(--good); }
  .acc-head svg.chev{ width:15px; height:15px; color:var(--text-faint); transition:transform .15s; flex-shrink:0; }
  .acc-head.open svg.chev{ transform:rotate(90deg); }
  .acc-body{ padding:0 14px 12px; border-top:1px solid var(--border); }
  .acc-sub{ margin-top:10px; }

  .week-row{ display:flex; align-items:center; justify-content:space-between; padding:9px 10px; border-radius:8px; cursor:pointer; gap:8px; }

  .week-row .rng{ font-size:12.5px; color:var(--text-dim); display:flex; align-items:center; gap:7px; }
  .week-row .stats{ display:flex; gap:12px; font-family:'IBM Plex Mono',monospace; font-size:13.5px; }

  .tx-mini{ display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 10px; border-radius:8px; font-size:12.5px; }
  .tx-mini:hover{ background:var(--panel-2); }
  .tx-mini .left{ display:flex; align-items:center; gap:8px; min-width:0; }
  .tx-mini .note{ color:var(--text-faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:160px; }

  /* toggle switch */
  .switch{ position:relative; display:inline-block; width:40px; height:23px; flex-shrink:0; }
  .switch input{ opacity:0; width:0; height:0; }

  .switch .slider::before{ content:""; position:absolute; width:17px; height:17px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.15s; }
  .switch input:checked + .slider{ background:var(--good); }
  .switch input:checked + .slider::before{ transform:translateX(17px); }

  .courier-row .info .meta{ font-size:13.5px; color:var(--text-faint); font-family:'IBM Plex Mono',monospace; }

  .modal-close-row{ display:flex; justify-content:flex-end; margin-top:16px; gap:10px; }

  .swatch-picker{ display:flex; gap:8px; flex-wrap:wrap; }
  .swatch{ width:28px; height:28px; border-radius:8px; cursor:pointer; border:2px solid transparent; }
  .swatch.sel{ border-color:var(--text); }

  .toast{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .toast-action{ border:none; background:var(--accent-bg); color:var(--accent-strong); font-family:inherit; font-weight:700; font-size:12.5px; border-radius:7px; padding:6px 11px; cursor:pointer; flex-shrink:0; }

  .chips{ display:flex; gap:6px; flex-wrap:wrap; }
  .chip-btn{ border:1px solid var(--border); background:var(--panel-2); color:var(--text-dim); border-radius:99px; padding:6px 11px; font-size:12.5px; font-weight:600; cursor:pointer; font-family:inherit; }
  .chip-btn:hover{ color:var(--text); }
  .chip-btn.active{ background:var(--accent-bg); color:var(--accent-strong); border-color:color-mix(in srgb, var(--accent) 40%, var(--border)); }

  .card-actions{ display:flex; gap:6px; margin-top:10px; }
  .card-actions .btn{ flex:1; justify-content:center; padding:7px 8px; }
  .hint-line{ font-size:13px; color:var(--text-dim); margin-top:4px; line-height:1.45; }
  .hint-line.warn{ color:var(--bad); font-weight:600; }
  .alert-strip{ border:1px solid color-mix(in srgb, var(--bad) 45%, var(--border)); background:var(--bad-bg); border-radius:12px; padding:12px 14px; margin-bottom:16px; font-size:13.5px; color:var(--text); display:flex; flex-direction:column; gap:6px; }

  .issue-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); font-size:13.5px; line-height:1.45; }

  .kv dt{ color:var(--text-faint); } .kv dd{ margin:0; font-weight:600; }
  .scroll-box{ max-height:380px; overflow:auto; }
  .nav-item.settings-link{ margin-top:2px; }
  .import-opt{ display:flex; align-items:flex-start; gap:10px; border:1px solid var(--border); border-radius:10px; padding:11px 12px; cursor:pointer; font-size:13.5px; line-height:1.45; color:var(--text-dim); }

  td.note-cell{ color:var(--text-dim); }

  [role="button"][tabindex]:focus-visible, .swatch:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .swatch{ padding:0; }
  .link-btn{ background:none; border:none; color:inherit; font:inherit; display:inline-flex; align-items:center; gap:9px; padding:0; cursor:pointer; text-align:left; }
  .row-main{ display:flex; align-items:center; gap:12px; flex:1; min-width:0; }
  .row-main .info{ min-width:0; }

  /* print preview / printing */
  #printRoot:empty{ display:none; }
  .print-overlay{ position:fixed; inset:0; z-index:80; background:rgba(4,6,8,.62); overflow:auto; padding:16px; -webkit-overflow-scrolling:touch; }
  .print-toolbar{ position:sticky; top:0; z-index:1; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; max-width:210mm; margin:0 auto 12px; background:var(--panel); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur); border:1px solid var(--border); border-radius:12px; padding:10px 12px; color:var(--text); }
  @media screen and (max-width:640px){
    .print-overlay{ padding:8px; }
    .print-page{ padding:5mm !important; overflow-x:auto; }
    .print-page .rep-sum{ grid-template-columns:repeat(2,minmax(0,1fr)) !important; }
    .print-page .doc-grid{ grid-template-columns:minmax(0,32mm) minmax(0,1fr) !important; }
    .print-page .doc{ padding:5mm !important; }
    .print-page .doc-sign{ gap:6mm !important; }
  }
  @media print{
    html, body{ background:#fff !important; }
    body::before, body::after{ display:none !important; }
    .app, .bottom-nav, .fab-spacer, #modalRoot, #toastRoot, .print-toolbar, .ep-runtime-banner{ display:none !important; }
    .print-overlay{ position:static; background:none; padding:0; overflow:visible; }
    .print-page{ box-shadow:none !important; margin:0 !important; max-width:none !important; padding:0 !important; border-radius:0 !important; }
    @page{ size:A4; margin:12mm; }
  }

  code.k{ background:var(--panel-2); border:1px solid var(--border); border-radius:5px; padding:1px 6px; font-family:'IBM Plex Mono',monospace; font-size:13.5px; }
  .visually-hidden{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }
</style>
</head>

// IMPORTANT: use LOCAL date components everywhere, never toISOString()/UTC
// getters for calendar dates — for any timezone ahead of UTC (e.g. Poland,
// UTC+1/+2), converting a local-midnight Date to its UTC string rolls it
// back to the previous day, silently shifting every date one day earlier
// and misaligning it with its weekday label. toKey() is the single place
// that turns a Date into a "YYYY-MM-DD" key; every other date function
// funnels through it, so fixing it here fixes the whole app.
function toKey(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function todayStr(){ return toKey(new Date()); }
function fmtDate(s){ if(!s) return '—'; const [y,m,d] = s.split('-'); return `${d}.${m}.${y}`; }
function fmtDateLong(s){ const d = new Date(s+'T00:00:00'); return d.toLocaleDateString('pl-PL', {day:'2-digit', month:'long', year:'numeric'}); }
function num(n){ return new Intl.NumberFormat('pl-PL').format(n); }
function fmt1(n){ return new Intl.NumberFormat('pl-PL',{maximumFractionDigits:1}).format(n); }
// current courier name (follows renames); falls back to the name stored on the operation
function txCourierName(t){ const c = courierById(t.kurierId); return c ? c.name : (t.kurierNazwa||'(usunięty)'); }
function daysBetween(a,b){ return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000); }
function pctChange(cur, prev){ return prev>0 ? Math.round((cur-prev)/prev*100) : null; }
function pctLabel(cur, prev){
  if(prev===0) return cur>0 ? 'wzrost od zera' : 'bez zmian';
  const raw = (cur-prev)/prev*100;

// Polish plural: 1 paleta, 2–4 palety (but 12–14 palet), 5+ palet
function plForm(n, one, few, many){
  n = Math.abs(n);
  if(!Number.isInteger(n)) return few;
  if(n===1) return one;
  const d = n%10, h = n%100;
  return (d>=2 && d<=4 && (h<12 || h>14)) ? few : many;
}

// amount in words for printed documents (1 → "jeden", 112 → "sto dwanaście")
function slownie(n){
  n = Math.floor(Math.abs(n));
  if(n===0) return 'zero';
  const J=['','jeden','dwa','trzy','cztery','pięć','sześć','siedem','osiem','dziewięć'];
  const N=['dziesięć','jedenaście','dwanaście','trzynaście','czternaście','piętnaście','szesnaście','siedemnaście','osiemnaście','dziewiętnaście'];
  const D=['','','dwadzieścia','trzydzieści','czterdzieści','pięćdziesiąt','sześćdziesiąt','siedemdziesiąt','osiemdziesiąt','dziewięćdziesiąt'];
  const S=['','sto','dwieście','trzysta','czterysta','pięćset','sześćset','siedemset','osiemset','dziewięćset'];
  const trio = (x)=>{ const out=[]; const h=Math.floor(x/100), r=x%100; if(h) out.push(S[h]); if(r>=10 && r<20) out.push(N[r-10]); else { const t=Math.floor(r/10), u=r%10; if(t) out.push(D[t]); if(u) out.push(J[u]); } return out.join(' '); };
  const groups = [['','',''],['tysiąc','tysiące','tysięcy'],['milion','miliony','milionów']];
  const parts = []; let g = 0;
  while(n>0 && g<groups.length){
    const x = n%1000;
    if(x){
      if(g===0) parts.unshift(trio(x));
      else parts.unshift((x===1 ? '' : trio(x)+' ') + plForm(x, ...groups[g]));
    }
    n = Math.floor(n/1000); g++;
  }
  return parts.join(' ').replace(/\s+/g,' ').trim();
}

}

/* ---------------------------- DOCKET NUMBERS ---------------------------- */
// Document numbers are stored on each operation (field "nr") the moment it is created, so deleting
// an operation never renumbers the ones after it. legacyDocketMap() reproduces the old, computed
// numbering only for operations saved before numbers were stored, and is used once to freeze them.
function docketPrefix(typ){ return typ==='wydanie' ? 'WZ' : 'PZ'; }
function docketNum(nr){ const m = /^(WZ|PZ)-(\d+)$/.exec(nr||''); return m ? parseInt(m[2],10) : 0; }
function hasValidNr(t){ return typeof t.nr==='string' && /^(WZ|PZ)-\d+$/.test(t.nr) && t.nr.startsWith(docketPrefix(t.typ)); }
function padNr(typ, n){ return `${docketPrefix(typ)}-${String(n).padStart(5,'0')}`; }
function legacyDocketMap(){
  const sorted = [...transactions].sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  const counts = {wydanie:0, zwrot:0}; const map = {};
  for(const t of sorted){
    counts[t.typ] = (counts[t.typ]||0)+1;
    map[t.id] = padNr(t.typ, counts[t.typ]);
  }
  return map;
}
function buildDocketMap(){
  const legacy = legacyDocketMap(); const map = {};
  for(const t of transactions) map[t.id] = hasValidNr(t) ? t.nr : legacy[t.id];
  return map;
}
const DOCKET_MAX = 9999999;
const saneNum = (n)=> (Number.isSafeInteger(n) && n>=0 && n<=1e12) ? n : 0;   // guards against absurd values (a number from a file is at most DOCKET_MAX)
function nextDocketNumber(typ, stored){
  const key = typ==='wydanie' ? 'wz' : 'pz';
  const map = buildDocketMap();
  let max = Math.max(saneNum((counters && counters[key]) || 0), saneNum((stored && stored[key]) || 0));
  for(const t of transactions){ if(t.typ===typ) max = Math.max(max, saneNum(docketNum(map[t.id]))); }
  return max+1;
}
// One device at a time hands out WZ/PZ numbers: a short cooperative lease on meta/numeracja (where
// the store offers leases), and the counter is re-read right before it is moved — never written back
// from a stale local copy, so one device can't lower the counter another just raised.
const TAB_ID = 'tab-' + Math.random().toString(36).slice(2, 10);
// numbering steps of this tab run one after another (a lease held by this tab would otherwise let a
// second step of the same tab in); the lease is renewed every second while a step runs, so a slow
// network/disk can't let it lapse halfway through
let numberingChain = Promise.resolve();
function withNumberingLock(fn){
  const run = numberingChain.then(()=>lockedStep(fn));
  numberingChain = run.catch(()=>{});
  return run;
}
let activeLock = null;   // {lost} of the numbering step running now; writeCounters refuses to write after a lost lease
async function lockedStep(fn){
  const lock = db.doc('meta/numeracja');
  if(typeof lock.acquire !== 'function') return fn();
  for(let i=0; i<25; i++){
    let res = null;
    try{ res = await lock.acquire({holder:TAB_ID, ttlMs:2500}); }
    catch(e){ console.warn('lease', e); if(e && e.auth) throw e; throw Object.assign(new Error('Brak połączenia z bazą — numer dokumentu nie został nadany.'), {code:'unavailable'}); }
    if(res && res.acquired){
      const state = {lost:false};
      const renew = setInterval(()=>{ lock.acquire({holder:TAB_ID, ttlMs:2500}).then(r=>{ if(r && r.acquired===false) state.lost = true; }).catch(()=>{}); }, 1000);
      activeLock = state;
      try{ return await fn(); } finally { clearInterval(renew); if(activeLock===state) activeLock = null; }
    }
    await new Promise(r=>setTimeout(r, 200 + i*60));
  }
  throw Object.assign(new Error('Numeracja dokumentów jest zajęta — spróbuj ponownie.'), {code:'busy'});
}
async function readCounters(){
  const snap = await db.doc('meta/counters').get();
  return {exists: snap.exists, data: snap.exists ? (snap.data()||{}) : {}};
}
async function writeCounters(cur, patch){
  if(activeLock && activeLock.lost) throw Object.assign(new Error('Numeracja dokumentów jest zajęta — spróbuj ponownie.'), {code:'busy'});
  if(cur.exists) await db.doc('meta/counters').update(patch);
  else await db.doc('meta/counters').set({...cur.data, ...patch});
  counters = {...(counters||{}), ...cur.data, ...patch};
}
async function allocDocket(typ){
  const key = typ==='wydanie' ? 'wz' : 'pz';
  return withNumberingLock(async ()=>{
    const cur = await readCounters();
    const n = nextDocketNumber(typ, cur.data);
    await writeCounters(cur, {[key]: n});
    return padNr(typ, n);
  });
}
// a failed save gives its number back, unless someone else has taken a later one meanwhile
async function releaseDocket(nr){
  const typ = nr.startsWith('WZ') ? 'wydanie' : 'zwrot', key = typ==='wydanie' ? 'wz' : 'pz', n = docketNum(nr);
  try{ await withNumberingLock(async ()=>{ const cur = await readCounters(); if(cur.exists && cur.data[key]===n) await writeCounters(cur, {[key]: n-1}); }); }
  catch(e){ console.warn('release', e); }
}
// safety net for stores without leases: if the same number landed on two operations, the later one
// (by creation time) takes a fresh number
async function ensureUniqueDocket(id, nr, typ){
  try{
    const snap = await db.collection('transactions').where('nr','==',nr).get();
    if(snap.docs.length < 2) return nr;
    // whoever received the number first keeps it (nrAt = when the number was given; older data: createdAt)
    const first = snap.docs.map(d=>{ const x = d.data()||{}; return {id:d.id, c:x.nrAt||x.createdAt||0}; }).sort((a,b)=> a.c-b.c || (a.id<b.id?-1:1))[0];
    if(first.id === id) return nr;
    const fresh = await allocDocket(typ);
    await db.collection('transactions').doc(id).update({nr: fresh, nrAt: Date.now()});
    toast(`Numer ${nr} został równocześnie nadany na innym urządzeniu — ta operacja dostała numer ${fresh}.`);
    return fresh;
  }catch(e){ console.warn('unique check', e); return nr; }
}
async function migrateDockets(){
  if(docketMigrationDone || !historyComplete || counters===null || !db) return;
  docketMigrationDone = true;
  const missing = transactions.filter(t=>!hasValidNr(t)).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  try{
    await withNumberingLock(async ()=>{
      const cur = await readCounters();
      const legacy = legacyDocketMap();
      const used = new Set(transactions.filter(hasValidNr).map(t=>t.nr));
      const next = {wydanie: nextDocketNumber('wydanie', cur.data), zwrot: nextDocketNumber('zwrot', cur.data)};
      migrating = missing.length>0;
      for(const t of missing){
        // keep the number people have already seen, unless a stored number uses it — then take the next free one
        let nr = legacy[t.id];
        if(used.has(nr)) nr = padNr(t.typ, next[t.typ]++);
        used.add(nr);
        await db.collection('transactions').doc(t.id).update({nr});
        if(olderTx.has(t.id)) olderTx.set(t.id, {...olderTx.get(t.id), nr});
      }
      const maxOf = (prefix)=> Math.max(0, ...[...used].filter(x=>x.startsWith(prefix)).map(docketNum));
      const now = await readCounters();   // re-read: the counter only ever goes up
      const target = {wz: Math.max(now.data.wz||0, cur.data.wz||0, maxOf('WZ')), pz: Math.max(now.data.pz||0, cur.data.pz||0, maxOf('PZ'))};
      if(!now.exists || now.data.wz!==target.wz || now.data.pz!==target.pz) await writeCounters(now, target);
    });
  }catch(e){
    // no connection / numbering busy (e.g. the server restarting): try again on the next update;
    // view-only viewers can't write — numbers still display from the computed fallback
    if(e && (e.code==='unavailable' || e.code==='busy')){ docketMigrationDone = false; console.warn('numeracja: ponowię później —', e.message); }
    else console.error(e);
  }
  if(migrating){ migrating = false; mergeTransactions(); render(true); }
}

  db.collection('couriers').orderBy('order','asc').onSnapshot((snap)=>{

  db.doc('meta/settings').onSnapshot((snap)=>{
    settings = snap.exists ? (snap.data()||{}) : {};

  }, (err)=>{ console.error(err); settings = {}; maybeSeed(); });

  // a failed read leaves counters === null: numbering and migration then wait instead of
  // writing a lower counter over the stored one
  db.doc('meta/counters').onSnapshot((snap)=>{
    counters = snap.exists ? (snap.data()||{}) : {};

  db.collection('transactions').orderBy('data','desc').limit(TX_WINDOW).onSnapshot((snap)=>{
    liveTx = snap.docs.map(d=>({id:d.id, ...d.data()}));
    if(liveTx.length>=TX_WINDOW){
      const minDate = liveTx[liveTx.length-1].data;

  // operations older than the live window are read once; refresh them when the page comes back
  // into view and every few minutes, so edits/deletes of old entries made elsewhere show up
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') refreshOlder(); });
  setInterval(refreshOlder, 2*60*1000);
  window.addEventListener('online', ()=>setTimeout(refreshOlder, 1500));
}
function refreshOlder(){
  if(!olderBoundary || !historyComplete || bulkWriting) return;
  if(window.EP_LOCAL && window.EP_LOCAL.online===false) return;   // local server unreachable: try again later
  loadOlderTransactions(olderBoundary, true);
}

// Default couriers are created once, for a brand-new empty database only — never again after the
// user deletes them (meta/settings.seeded remembers it, across devices and reloads).
let couriersLoaded = false, txLoaded = false, settings = null;
async function maybeSeed(){
  if(couriersSeeded || !couriersLoaded || !txLoaded || settings===null || bulkWriting) return;
  couriersSeeded = true;
  try{
    if(settings.seeded) return;
    if(couriers.length===0 && transactions.length===0 && invalidTx.length===0) await seedCouriers();
    await db.doc('meta/settings').set({...settings, seeded:true});
  }catch(e){ console.error(e); }
}

// Malformed operation documents (e.g. from a hand-edited import) are kept aside in invalidTx and
// listed under "Kontrola danych" instead of breaking every date/number computation in the app.
let invalidTx = [];
function isValidTx(t){ return t && typeof t.data==='string' && /^\d{4}-\d{2}-\d{2}$/.test(t.data) && (t.typ==='wydanie' || t.typ==='zwrot') && Number.isFinite(t.ilosc) && typeof t.kurierId==='string' && /^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(t.kurierId); }
function mergeTransactions(){
  const m = new Map(olderTx);
  for(const t of liveTx) m.set(t.id, t);
  const all = [...m.values()];
  transactions = all.filter(isValidTx);
  invalidTx = all.filter(t=>!isValidTx(t));
}
// pages through everything dated on/before the live window's oldest day
async function loadOlderTransactions(boundary, background){
  const token = ++olderLoadToken;
  olderLoading = true;
  const fetched = new Map();
  try{
    let b = boundary, exhausted = false;
    for(let guard=0; guard<500; guard++){
      const snap = await db.collection('transactions').where('data','<=',b).orderBy('data','desc').limit(TX_WINDOW).get();
      if(token!==olderLoadToken) return;   // a newer load has started: this one stops reading
      let added = 0;
      snap.docs.forEach(d=>{ if(!fetched.has(d.id)){ fetched.set(d.id, {id:d.id, ...d.data()}); added++; } });
      if(snap.docs.length<TX_WINDOW){ exhausted = true; break; }
      if(added===0){ exhausted = false; break; }   // 1000+ operations on one day — can't page further by date
      b = (snap.docs[snap.docs.length-1].data()||{}).data;
      if(typeof b!=='string'){ exhausted = true; break; }
    }
    if(token!==olderLoadToken) return;
    olderLoading = false;
    olderTx = fetched; historyComplete = true;
    if(!exhausted) toast('Historia jest bardzo duża — wczytano tylko część, sumy mogą być niepełne.', true);
  }catch(e){
    console.error(e);
    if(token===olderLoadToken){ olderLoading = false; if(!background) toast('Nie udało się wczytać starszej historii — sumy mogą być niepełne. Odśwież stronę.', true); }
    return;
  }
  mergeTransactions(); render(true); migrateDockets();
}
// A local write made while older history is being (re)loaded: start the load again, so its result
// is read after the write instead of overwriting it with the state from before.

/* ---------------------------- DATA HELPERS ---------------------------- */
function courierBalances(){
  const map = {};
  for(const c of couriers) map[c.id] = {courier:c, wydane:(c.openingWydane||0), zwrocone:(c.openingZwrot||0)};
  for(const t of transactions){
    if(!map[t.kurierId]) map[t.kurierId] = {courier:{id:t.kurierId, name:t.kurierNazwa||'(usunięty)', color:'#8A8578', enabled:false}, wydane:0, zwrocone:0};
    if(t.typ==='wydanie') map[t.kurierId].wydane += t.ilosc; else map[t.kurierId].zwrocone += t.ilosc;
  }
  return Object.values(map).map(x=>({...x, bilans:x.wydane-x.zwrocone}));
}
function totalOutstanding(){
  const txTotal = transactions.reduce((s,t)=> s + (t.typ==='wydanie'? t.ilosc : -t.ilosc), 0);
  const openingTotal = couriers.reduce((s,c)=> s + (c.openingWydane||0) - (c.openingZwrot||0), 0);
  return txTotal + openingTotal;
}
// How "stale" a courier's outstanding balance is, for staleness alerts.
// status 'dated'          — we know the exact date of the last logged return, so "days" is meaningful
// status 'coveredByOpening' — no dated return was ever logged, but the courier's opening balance
//                             (set once, with no date — see "Stan początkowy") already credits some
//                             returns, so we genuinely don't know when the last one was. Never claim
//                             "never returned" here — that would be a plain factual error.
// status 'never'          — no dated return AND no opening-balance credit: this courier really has
//                             never had a return recorded anywhere in the app.
function returnStaleInfo(courierId){
  const lastReturn = transactions.filter(t=>t.kurierId===courierId && t.typ==='zwrot').sort((a,b)=>b.data.localeCompare(a.data))[0];
  if(lastReturn){
    const days = Math.round((new Date(todayStr())-new Date(lastReturn.data))/86400000);
    return { status:'dated', days, date:lastReturn.data };
  }
  const c = courierById(courierId);
  if(c && (c.openingZwrot||0) > 0) return { status:'coveredByOpening' };
  // never had a dated return — only worth flagging once the relationship is old enough that a
  // return would reasonably be expected by now, so a courier used for the first time yesterday
  // doesn't immediately get branded as "never returns anything"
  const firstWydanie = transactions.filter(t=>t.kurierId===courierId && t.typ==='wydanie').sort((a,b)=>a.data.localeCompare(b.data))[0];
  const daysSinceFirst = firstWydanie ? Math.round((new Date(todayStr())-new Date(firstWydanie.data))/86400000) : null;
  if(daysSinceFirst!==null && daysSinceFirst>=10) return { status:'never' };
  return { status:'tooNewToTell' };
}
function inRange(dateStr, from, to){ if(from && dateStr < from) return false; if(to && dateStr > to) return false; return true; }
function periodBounds(period){
  const now = new Date();
  if(period==='week'){ const mon = weekStart(todayStr()); const sun = new Date(mon); sun.setDate(sun.getDate()+6); return {from: toKey(mon), to: toKey(sun)}; }
  if(period==='month'){
    const from = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`;
    const lastDay = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
    const to = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`;
    return {from, to};
  }
  if(period==='year'){ return {from:`${now.getFullYear()}-01-01`, to:`${now.getFullYear()}-12-31`}; }
  return {from:'', to:''};
}

// a just-saved operation / courier shows up immediately, without waiting for the database echo
function applyLocalTx(id, doc){
  if(olderTx.has(id)) olderTx.set(id, {...doc, id});
  const i = liveTx.findIndex(t=>t.id===id);
  if(i>-1) liveTx[i] = {...doc, id}; else if(!olderTx.has(id)) liveTx.push({...doc, id});
  mergeTransactions();
}

// fromData = re-render caused by a database update (not by the user). The operation form is then
// left untouched: rebuilding it would wipe what's being typed and — when editing — silently turn
// the edit form back into a "new operation" form, so saving created a duplicate instead of updating.
function render(fromData){
  renderNav();
  renderThemeToggle();
  const bal = num(totalOutstanding())+' szt.'+(historyComplete || !db ? '' : ' …');
  ['sidebarBalance','mobileBalance'].forEach(id=>{ const el = document.getElementById(id); el.textContent = bal; el.title = historyComplete ? '' : 'Wczytywanie starszej historii — suma może być jeszcze niepełna'; });
  const main = document.getElementById('main');
  if(!db) return;
  // data arrived while a date field is being typed into: rebuilding the view now would garble the
  // half-typed date, so wait until the field loses focus
  const ae = document.activeElement;
  if(fromData && ae && main.contains(ae) && ae.matches && ae.matches('input[type=date]') && currentView!=='new'){ pendingDataRender = true; return; }

  // preserve focus + cursor position across re-renders (typing in a filter
  // field triggers render(), which would otherwise steal focus after every keystroke)
  const active = document.activeElement;
  const focusId = (active && main.contains(active) && active.id) ? active.id : null;
  const selStart = focusId && typeof active.selectionStart==='number' ? active.selectionStart : null;
  const selEnd = focusId && typeof active.selectionEnd==='number' ? active.selectionEnd : null;
  // a control without an id is found again by its tag and data-* attributes
  const focusSel = (!focusId && active && active!==main && main.contains(active) && active.dataset && Object.keys(active.dataset).length)
    ? active.tagName.toLowerCase() + Object.entries(active.dataset).map(([k,v])=>`[data-${k.replace(/[A-Z]/g,m=>'-'+m.toLowerCase())}="${CSS.escape(v)}"]`).join('') : null;
  let focusIdx = 0; if(focusSel){ try{ focusIdx = Math.max(0, [...main.querySelectorAll(focusSel)].indexOf(active)); }catch(e){ focusIdx = 0; } }

  if(fromData && currentView==='new' && document.getElementById('opForm')){ refreshOpFormCouriers(); return; }
  if(currentView==='dashboard') main.innerHTML = viewDashboard();
  else if(currentView==='new') main.innerHTML = viewNewOp(editingId);
  else if(currentView==='history') main.innerHTML = viewHistory();
  else if(currentView==='stats') main.innerHTML = viewStats();
  else if(currentView==='couriers') main.innerHTML = viewCouriers();
  else if(currentView==='courierDetail') main.innerHTML = viewCourierDetail(selectedCourierId);
  else if(currentView==='settings') main.innerHTML = viewSettings();
  bindViewEvents();

  fitCharts(main);
  if(focusId){
    const el = document.getElementById(focusId);
    if(el){
      el.focus({preventScroll:true});
      if(selStart!==null){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  } else if(focusSel){
    let el = null; try{ const all = main.querySelectorAll(focusSel); el = all[focusIdx] || all[0] || null; }catch(e){ el = null; }
    if(el && el.offsetParent!==null) el.focus({preventScroll:true});
  }
}

function historyCourierOptions(){

function filteredTransactions(){

  const docketMap = q ? buildDocketMap() : null;
  return transactions.filter(t=>{
    if(f.kurier!=='all' && t.kurierId!==f.kurier) return false;
    if(f.typ!=='all' && t.typ!==f.typ) return false;
    if(!inRange(t.data, f.from, f.to)) return false;
    if(q){ const hay = `${txCourierName(t)} ${t.kurierNazwa||''} ${t.uwagi||''} ${docketMap[t.id]||''} ${t.numerListu||''}`.toLowerCase(); if(!hay.includes(q)) return false; }

/* ================================================================
